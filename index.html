      memberId = m.id; customerName = m.name;
      document.getElementById('co-members').innerHTML =
        '<div class="list-row"><div class="list-main">' + UI.avatar(m.name) + '<div><b>' + UI.esc(m.name) + '</b><span class="muted small">selected as customer</span></div></div>' + UI.icon('check', 15) + '</div>';
    });
  }

  function render(){
    var items = s.products.filter(function(p){ return cart[p.id]; });
    document.getElementById('co-items').innerHTML = items.map(function(p){
      var qty = cart[p.id];
      return '<tr><td>' + UI.esc(p.name) + '</td><td>' + UI.money(p.price) + '</td>' +
        '<td><div class="qty"><button class="icon-btn" data-q="' + p.id + '" data-d="-1">−</button>' +
        '<span>' + qty + '</span><button class="icon-btn" data-q="' + p.id + '" data-d="1">+</button></div></td>' +
        '<td class="numeric"><b>' + UI.money(qty * p.price) + '</b></td></tr>';
    }).join('') || '<tr><td colspan="4" class="empty-td">Cart is empty — pick products from the store grid first.</td></tr>';
    var total = items.reduce(function(sum, p){ return sum + cart[p.id] * p.price; }, 0);
    document.getElementById('co-grand').textContent = UI.money(total);
  }
  render();

  document.querySelector('#modal-root .modal').addEventListener('click', function(e){
    var t = e.target.closest('[data-d]');
    if (!t) return;
    var id = t.getAttribute('data-q'), d = +t.getAttribute('data-d');
    var p = s.products.find(function(x){ return x.id === id; });
    var next = (cart[id] || 0) + d;
    if (next < 1) next = 1;
    if (next > p.stock){ UI.toast('Only ' + p.stock + ' in stock', 'error'); return; }
    cart[id] = next;
    render();
  });

  document.getElementById('co-pay').addEventListener('click', function(){
    var items = s.products.filter(function(p){ return cart[p.id]; });
    if (!items.length){ UI.toast('Cart is empty', 'error'); return; }
    var saleItems = items.map(function(p){ return { productId: p.id, qty: cart[p.id], name: p.name, price: p.price }; });
    var total = Store.sell(saleItems, memberId, customerName);
    var actor = Auth.current();
    Store.log(actor ? actor.name : 'System', 'Completed POS sale' + (customerName ? ' — ' + customerName : '') + ' (' + UI.money(total) + ')');
    UI.closeOverlay();
    receiptModal(saleItems, total, customerName, memberId);
    Views.pos();
  });
}

/* ================= FINANCES ================= */
Views.finance = function(ctx){
  var s = Store.get();
  var all = s.transactions;
  var totalRev = all.filter(function(t){ return t.type === 'income'; }).reduce(function(a,t){ return a + t.amount; }, 0);
  var totalExp = all.filter(function(t){ return t.type === 'expense'; }).reduce(function(a,t){ return a + t.amount; }, 0);
  var net = totalRev - totalExp;
  var dues = Store.overdueDues();
  var mr = Store.monthRange(Date.now());
  var monthNet = Store.revenueBetween(mr.start, mr.end) - Store.expensesBetween(mr.start, mr.end);

  var html =
  '<div class="page-head"><div><h1>Finances</h1>' +
    '<p class="page-sub">Revenue, expenses, net profit/loss and overdue dues — auto-calculated from the ledger.</p></div>' +
    '<div class="page-actions">' +
      '<button class="btn" id="fin-export">' + UI.icon('download', 15) + ' Export CSV</button>' +
      '<button class="btn btn-primary" data-action="add-tx">' + UI.icon('plus', 15) + ' Add Transaction</button>' +
    '</div></div>' +

  '<div class="stat-grid">' +
    statCard('banknote', 'green', UI.money(totalRev), 'Total revenue', all.filter(function(t){return t.type==='income';}).length + ' entries', '') +
    statCard('list', 'red', UI.money(totalExp), 'Total expenses', all.filter(function(t){return t.type==='expense';}).length + ' entries', '') +
    statCard('up', net >= 0 ? 'blue' : 'red', UI.money(net), 'Net profit / loss', monthNet >= 0 ? 'positive this month' : 'negative this month', '') +
    statCard('alert', 'amber', UI.money(dues), 'Overdue dues', 'collect from members', 'members') +
  '</div>' +

  '<div class="grid-2">' +
    '<div class="card"><div class="card-head"><h3>Monthly income vs expenses</h3></div>' +
      '<div class="chart-box"><canvas id="ch-fin-month"></canvas></div></div>' +
    '<div class="card"><div class="card-head"><h3>Expenses by category</h3></div>' +
      '<div class="chart-box"><canvas id="ch-fin-cat"></canvas></div></div>' +
  '</div>' +

  '<div class="card mt"><div class="card-head"><h3>Transactions</h3>' +
    '<div class="toolbar-inline" style="display:flex;gap:8px">' +
      '<select id="ft-type" class="select"><option value="">All types</option><option value="income">Income</option><option value="expense">Expense</option></select>' +
      '<select id="ft-cat" class="select">' + catOptions('') + '</select>' +
    '</div></div>' +
    '<div class="table-wrap"><table class="table"><thead><tr>' +
      '<th>Date</th><th>Type</th><th>Category</th><th>Description</th><th class="th-numeric">Amount</th><th></th>' +
    '</tr></thead><tbody id="tx-body"></tbody></table></div></div>' +

  '<div class="card mt"><div class="card-head"><h3>Overdue members</h3><span class="count-pill">' + UI.money(dues) + '</span></div>' +
    '<div class="list" id="ovd-list"></div></div>';

  document.getElementById('view').innerHTML = html;

  if (ctx && ctx.open === 'add-tx') txForm();

  /* charts */
  var series = [];
  var dd = new Date();
  for (var i = 5; i >= 0; i--){
    var d0 = new Date(dd.getFullYear(), dd.getMonth() - i, 1);
    var r = Store.monthRange(d0.getTime());
    series.push({ label: d0.toLocaleDateString('en', { month:'short' }),
      income: Store.revenueBetween(r.start, r.end), expense: Store.expensesBetween(r.start, r.end) });
  }
  var cats = {};
  all.filter(function(t){ return t.type === 'expense'; }).forEach(function(t){ cats[t.category] = (cats[t.category] || 0) + t.amount; });
  if (window.Chart){
    App.chart('ch-fin-month', { type:'bar', data:{
        labels: series.map(function(x){ return x.label; }),
        datasets: [
          { label:'Income', data: series.map(function(x){ return x.income; }), backgroundColor:'rgba(5,150,105,.8)', borderRadius:5 },
          { label:'Expenses', data: series.map(function(x){ return x.expense; }), backgroundColor:'rgba(220,38,38,.75)', borderRadius:5 }
        ] },
      options: baseOpts('Rs', '') });
    var catKeys = Object.keys(cats);
    App.chart('ch-fin-cat', { type:'doughnut', data:{
        labels: catKeys,
        datasets:[{ data: catKeys.map(function(k){ return cats[k]; }),
          backgroundColor: ['#059669','#d97706','#0284c7','#7c3aed','#dc2626','#ea580c','#0d9488','#db2777'] }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins: { legend: { position:'right', labels: { color:'#98a2b3', boxWidth:10, boxHeight:10, usePointStyle:true, font:{size:11} } } } } });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.chart-box'), function(b){ b.innerHTML = '<p>Charts need internet (Chart.js).</p>'; });
  }

  /* transactions table */
  var F = { type:'', cat:'' };
  function renderTx(){
    var rows = all.filter(function(t){
      if (F.type && t.type !== F.type) return false;
      if (F.cat && t.category !== F.cat) return false;
      return true;
    }).sort(function(a,b){ return b.ts - a.ts; });
    document.getElementById('tx-body').innerHTML = rows.map(function(t){
      var pos = t.type === 'income';
      return '<tr><td>' + UI.fmtDate(t.ts) + '</td>' +
        '<td>' + (pos ? '<span class="badge b-active">Income</span>' : '<span class="badge b-overdue">Expense</span>') + '</td>' +
        '<td><span class="plan-chip">' + UI.esc(t.category) + '</span></td>' +
        '<td>' + UI.esc(t.desc || '') + '</td>' +
        '<td class="numeric ' + (pos ? 'amt-pos' : 'amt-neg') + '">' + (pos ? '+' : '−') + UI.money(t.amount) + '</td>' +
        '<td><button class="icon-btn danger" data-action="tx-del" data-id="' + t.id + '" title="Delete">' + UI.icon('trash', 14) + '</button></td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty-td">No transactions.</td></tr>';
  }
  renderTx();
  document.getElementById('ft-type').addEventListener('change', function(){ F.type = this.value; renderTx(); });
  document.getElementById('ft-cat').addEventListener('change', function(){ F.cat = this.value; renderTx(); });
  document.getElementById('fin-export').addEventListener('click', function(){
    UI.download('transactions-' + UI.todayStr() + '.csv', Store.exportTransactionsCSV(), 'text/csv');
    UI.toast('Transactions CSV downloaded', 'success');
  });

  /* overdue list */
  var ovd = s.members.filter(function(m){ return Store.statusOf(m) === 'overdue'; }).sort(function(a,b){ return a.renewal - b.renewal; });
  document.getElementById('ovd-list').innerHTML = ovd.map(function(m){
    return '<div class="list-row"><div class="list-main">' + UI.avatar(m.name) +
      '<div><b>' + UI.esc(m.name) + '</b><span class="muted small">due ' + UI.fmtDate(m.renewal) + ' · ' + UI.money(s.settings.planFee[m.plan]) + '</span></div></div>' +
      '<button class="btn btn-sm btn-primary" data-action="paid" data-id="' + m.id + '">Mark Paid</button></div>';
  }).join('') || '<p class="muted small">No overdue members.</p>';

  document.getElementById('view').onclick = function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var act = t.getAttribute('data-action'), id = t.getAttribute('data-id');
    if (act === 'go') App.nav(t.getAttribute('data-view'));
    else if (act === 'add-tx') txForm();
    else if (act === 'tx-del'){
      UI.confirmAction('Delete transaction', 'Delete this ledger entry?', function(){
        Store.deleteTransaction(id);
        UI.toast('Transaction deleted', 'success');
        Views.finance();
      }, 'Delete');
    }
    else if (act === 'paid' && id){
      var m = Store.member(id);
      if (m) markPaidFlow(m);
    }
  };
};

function catOptions(sel){
  var cats = ['Dues','Supplements','Lockers','Rent','Utilities','Salaries','Equipment','Other'];
  return '<option value="">All categories</option>' + cats.map(function(c){
    return '<option value="' + c + '"' + (sel === c ? ' selected' : '') + '>' + c + '</option>';
  }).join('');
}
function txForm(){
  var body =
    '<div class="form-grid-2">' +
      '<div class="field"><label>Type</label><select id="tx-type" class="input">' +
        '<option value="income">Income</option><option value="expense">Expense</option></select></div>' +
      '<div class="field"><label>Category</label><select id="tx-cat" class="input"></select></div>' +
      '<div class="field"><label>Amount (' + Store.get().settings.currency + ') *</label><input id="tx-amt" type="number" min="0" class="input" /></div>' +
      '<div class="field"><label>Date</label><input type="date" id="tx-date" class="input" value="' + UI.todayStr() + '" /></div>' +
    '</div>' +
    '<div class="field"><label>Description</label><input id="tx-desc" class="input" placeholder="e.g. Monthly gym hall rent" /></div>';
  var footer = '<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="tx-save">' + UI.icon('check', 15) + ' Save</button>';
  UI.showModal('Add transaction', body, footer);

  var incomeCats = ['Dues','Supplements','Lockers','Other'];
  var expenseCats = ['Rent','Utilities','Salaries','Equipment','Supplements','Other'];
  function renderCats(){
    var type = document.getElementById('tx-type').value;
    var list = type === 'income' ? incomeCats : expenseCats;
    document.getElementById('tx-cat').innerHTML = list.map(function(c){ return '<option>' + c + '</option>'; }).join('');
  }
  renderCats();
  document.getElementById('tx-type').addEventListener('change', renderCats);

  document.getElementById('tx-save').addEventListener('click', function(){
    var amt = +document.getElementById('tx-amt').value;
    if (!amt || amt <= 0){ UI.toast('Enter a valid amount', 'error'); return; }
    Store.addTransaction({
      type: document.getElementById('tx-type').value,
      category: document.getElementById('tx-cat').value,
      amount: amt,
      desc: document.getElementById('tx-desc').value.trim(),
      ts: UI.parseDate(document.getElementById('tx-date').value) || Date.now()
    }, false);
    UI.toast('Transaction added', 'success');
    UI.closeOverlay();
    Views.finance();
  });
}

/* ============================================================
   GymFlow — Views: Staff Schedule, Lockers, Settings & Backup
   ============================================================ */
window.Views = window.Views || {};

var WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ================= SCHEDULE ================= */
Views.schedule = function(){
  var s = Store.get();
  var shifts = s.shifts;
  var staff = {};
  shifts.forEach(function(sh){ staff[sh.staffName] = sh.role; });
  var staffNames = Object.keys(staff).sort();

  var html =
  '<div class="page-head"><div><h1>Staff schedule</h1>' +
    '<p class="page-sub">Weekly working shifts for every staff role.</p></div>' +
    '<div class="page-actions"><button class="btn btn-primary" data-action="add-shift">' + UI.icon('plus', 15) + ' Add Shift</button></div></div>' +

  '<div class="card"><div class="table-wrap"><table class="table schedule-table"><thead><tr>' +
    '<th style="width:170px;text-align:left">Staff</th>' + WEEKDAYS.map(function(d){ return '<th>' + d + '</th>'; }).join('') +
  '</tr></thead><tbody>' +
    staffNames.map(function(nm){
      return '<tr><td style="text-align:left"><b>' + UI.esc(nm) + '</b><div class="muted small">' + UI.esc(staff[nm]) + '</div></td>' +
        WEEKDAYS.map(function(_, di){
          var cell = shifts.filter(function(sh){ return sh.staffName === nm && sh.day === di; });
          return '<td class="shift-cell">' + (cell.length ? cell.map(function(sh){
            return '<span class="shift-chip">' + sh.start + '–' + sh.end +
              '<button class="shift-x" data-action="del-shift" data-id="' + sh.id + '" title="Remove">✕</button></span>';
          }).join('') : '') + '</td>';
        }).join('') + '</tr>';
    }).join('') +
  '</tbody></table></div></div>' +

  '<div class="card mt"><div class="card-head"><h3>Staff summary</h3></div>' +
    '<div class="list">' + staffNames.map(function(nm){
      var total = shifts.filter(function(sh){ return sh.staffName === nm; });
      return '<div class="list-row"><div class="list-main">' + UI.avatar(nm) +
        '<div><b>' + UI.esc(nm) + '</b><span class="muted small">' + UI.esc(staff[nm]) + ' · ' + total.length + ' shifts / week</span></div></div></div>';
    }).join('') + '</div></div>';

  document.getElementById('view').innerHTML = html;

  document.getElementById('view').onclick = function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var act = t.getAttribute('data-action'), id = t.getAttribute('data-id');
    if (act === 'add-shift') shiftForm();
    else if (act === 'del-shift'){
      UI.confirmAction('Remove shift', 'Remove this shift?', function(){
        Store.deleteShift(id);
        UI.toast('Shift removed', 'success');
        Views.schedule();
      }, 'Remove');
    }
  };
};

function shiftForm(){
  var s = Store.get();

    return '<option value="' + u.name + '">' + UI.esc(u.name) + ' (' + Auth.roleLabel(u.role) + ')</option>';

/* ================= LOCKERS ================= */
Views.lockers = function(){

  var vacant = lockers.length - occupied;
  var monthly = lockers.filter(function(l){ return l.memberId; }).reduce(function(a,l){ return a + l.fee; }, 0);

  var html =
  '<div class="page-head"><div><h1>Lockers</h1>' +
    '<p class="page-sub">' + occupied + ' occupied · ' + vacant + ' vacant · monthly locker income ' + UI.money(monthly) + '</p></div>' +
    '<div class="page-actions"><button class="btn btn-primary" data-action="add-locker">' + UI.icon('plus', 15) + ' Add Locker</button></div></div>' +

  '<div class="locker-grid">' +
    lockers.map(function(l){
      var m = l.memberId ? Store.member(l.memberId) : null;
      var cls = m ? (Store.statusOf(m) === 'overdue' ? 'lk-overdue' : 'lk-occupied') : 'lk-vacant';
      return '<div class="locker-card ' + cls + '">' +
        '<div class="lk-head"><span class="lk-num">Locker #' + l.num + '</span>' +
          (m ? '<span class="badge b-active">Occupied</span>' : '<span class="badge b-inactive">Vacant</span>') + '</div>' +
        (m ? '<div class="lk-mem">' + UI.avatar(m.name) + '<div><b>' + UI.esc(m.name) + '</b>' +
          '<span class="muted small">' + UI.esc(m.plan) + '</span></div></div>'
          : '<p class="muted small">Available for rent</p>') +
        '<div class="lk-meta"><span>Fee: <b>' + UI.money(l.fee) + '</b>/mo</span>' +
          (m ? '<span>Key: <b>' + (l.keyWith === 'member' ? 'with member' : 'front desk') + '</b></span>' : '') + '</div>' +
        '<div class="row-actions">' +
          (m
            ? '<button class="btn btn-sm btn-primary" data-action="lk-fee" data-id="' + l.id + '">' + UI.icon('card', 12) + ' Collect fee</button>' +
              '<button class="icon-btn" data-action="lk-edit" data-id="' + l.id + '" title="Edit">' + UI.icon('pencil', 13) + '</button>' +
              '<button class="icon-btn" data-action="lk-release" data-id="' + l.id + '" title="Release">' + UI.icon('x', 13) + '</button>'
            : '<button class="btn btn-sm btn-primary" data-action="lk-edit" data-id="' + l.id + '">Assign</button>') +
          '<button class="icon-btn danger" data-action="lk-del" data-id="' + l.id + '" title="Delete">' + UI.icon('trash', 13) + '</button>' +
        '</div></div>';
    }).join('') +
  '</div>';

  document.getElementById('view').innerHTML = html;

  document.getElementById('view').onclick = function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var act = t.getAttribute('data-action'), id = t.getAttribute('data-id');
    var l = lockers.find(function(x){ return x.id === id; });
    var actor = Auth.current();
    if (act === 'add-locker') lockerForm(null);
    else if (act === 'lk-edit' && l) lockerForm(l);
    else if (act === 'lk-fee' && l){
      Store.addTransaction({ type:'income', category:'Lockers', amount:l.fee, desc:'Locker #' + l.num + ' fee — ' + ((Store.member(l.memberId) || {}).name || '') }, false);
      Store.log(actor ? actor.name : 'System', 'Collected locker fee — #' + l.num + ' (' + UI.money(l.fee) + ')');
      UI.toast(UI.money(l.fee) + ' locker fee logged', 'success');
      Views.lockers();
    }
    else if (act === 'lk-release' && l){
      UI.confirmAction('Release locker', 'Release locker #' + l.num + '?', function(){
        l.memberId = null; l.keyWith = 'frontdesk';
        Store.updateLocker(l);
        UI.toast('Locker #' + l.num + ' released', 'success');
        Views.lockers();
      }, 'Release');
    }
    else if (act === 'lk-del' && l){
      UI.confirmAction('Delete locker', 'Delete locker #' + l.num + '?', function(){
        Store.deleteLocker(l.id);
        UI.toast('Locker deleted', 'success');
        Views.lockers();
      }, 'Delete');
    }
  };
};

function lockerForm(l){

    return '<option value="' + m.id + '"' + (l && l.memberId === m.id ? ' selected' : '') + '>' + UI.esc(m.name) + '</option>';

  });

    set.waQuote = document.getElementById('st-wa-quote').value;
    set.quotes = document.getElementById('st-quotes').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);

    UI.toast('WhatsApp templates saved', 'success');
  });

  document.getElementById('u-add').addEventListener('click', function(){ userForm(null); });

    var t = e.target.closest('[data-action]');
    if (!t) return;
    var act = t.getAttribute('data-action'), id = t.getAttribute('data-id');
    if (act === 'u-edit'){
      var u = s.users.find(function(x){ return x.id === id; });
      if (u) userForm(u);
    } else if (act === 'u-del'){
      UI.confirmAction('Delete user', 'Remove this user account?', function(){
        if (!Store.deleteUser(id)) UI.toast('Cannot delete the last manager', 'error');
        else { UI.toast('User removed', 'success'); Views.settings(); }
      }, 'Delete');
    }
  };

  document.getElementById('bk-export').addEventListener('click', function(){
    var name = (set.gymName || 'gym').toLowerCase().replace(/\s+/g, '-');

    UI.toast('Backup downloaded', 'success');
  });
  document.getElementById('bk-csv').addEventListener('click', function(){
    UI.download('members-' + UI.todayStr() + '.csv', Store.exportMembersCSV(), 'text/csv');
    UI.toast('Members CSV downloaded', 'success');
  });
  document.getElementById('bk-tx').addEventListener('click', function(){
    UI.download('ledger-' + UI.todayStr() + '.csv', Store.exportTransactionsCSV(), 'text/csv');
    UI.toast('Ledger CSV downloaded', 'success');
  });
  document.getElementById('bk-att').addEventListener('click', function(){
    UI.download('attendance-' + UI.todayStr() + '.csv', Store.exportAttendanceCSV(), 'text/csv');
    UI.toast('Attendance CSV downloaded', 'success');
  });
  var fileEl = document.getElementById('bk-file');
  document.getElementById('bk-import').addEventListener('click', function(){ fileEl.click(); });
  fileEl.addEventListener('change', function(){
    var f = fileEl.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var obj = JSON.parse(reader.result);
        if (!obj.users || !obj.members || !obj.settings) throw new Error('bad format');
        Store.importData(obj);
        UI.toast('Backup restored — reloading…', 'success');
        setTimeout(function(){ location.reload(); }, 800);
      } catch(err){
        UI.toast('Invalid backup file: ' + err.message, 'error');
      }
    };
    reader.readAsText(f);
    fileEl.value = '';
  });

  document.getElementById('bk-demo').addEventListener('click', function(){
    UI.confirmAction('Reload demo data', 'This overwrites all current data with the demo dataset. Continue?', function(){
      Store.resetDemo();
      UI.toast('Demo data loaded — reloading…', 'success');
      setTimeout(function(){ location.reload(); }, 800);
    });
  });
  document.getElementById('bk-clear').addEventListener('click', function(){
    UI.confirmAction('Clear all data', 'This permanently deletes ALL data. Export a backup first! Continue?', function(){
      Store.clearAll();
      UI.toast('All data cleared — reloading…', 'success');
      setTimeout(function(){ location.reload(); }, 800);
    });
  });
};

/* ============================================================
   GymFlow — Bootstrap: login gate, router, sidebar, command
   palette, theming, keyboard shortcuts
   ============================================================ */
window.App = (function(){
  'use strict';

  var charts = {};
  var currentView = null;

  function destroyChart(key){ if (charts[key]){ try { charts[key].destroy(); } catch(e){} charts[key] = null; } }
  function chart(canvasId, cfg){
    var el = document.getElementById(canvasId);
    if (!el) return;
    destroyChart(canvasId);
    charts[canvasId] = new Chart(el, cfg);
  }

  /* ---------------- theme ---------------- */
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('gymflow_theme', t); } catch(e){}
    var btn = document.getElementById('btn-theme');
    if (btn) btn.innerHTML = UI.icon(t === 'dark' ? 'sun' : 'moon', 15);
  }
  function themeInit(){
    var saved = null;
    try { saved = localStorage.getItem('gymflow_theme'); } catch(e){}
    applyTheme(saved || 'light');
    var btn = document.getElementById('btn-theme');
    if (btn) btn.addEventListener('click', function(){
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  /* ---------------- login ---------------- */
  function renderLogin(){
    var s = Store.get();
    document.getElementById('login-gym-name').textContent = s.settings.gymName;

    var roles = [
      { r:'manager',   icon:'user',  label:'Manager' },
      { r:'frontdesk', icon:'users', label:'Front Desk' },
      { r:'trainer',   icon:'dumbbell', label:'Trainer' }
    ];
    document.getElementById('role-picker').innerHTML = roles.map(function(x){
      return '<button class="role-card" data-role="' + x.r + '"><span class="role-ic">' + UI.icon(x.icon, 22) + '</span><b>' + x.label + '</b></button>';
    }).join('');

    var currentRole = null;
    var pass = { code:'' };
    var passArea = document.getElementById('passcode-area');
    var dots = document.getElementById('pass-dots');
    var err = document.getElementById('login-error');
    var unlock = document.getElementById('btn-unlock');

    function renderDots(){
      var n = pass.code.length;
      dots.innerHTML = Array(Math.max(n, 4)).fill(0).map(function(_, i){
        return '<span class="dot' + (i < n ? ' on' : '') + '"></span>';
      }).join('');
      unlock.disabled = pass.code.length < 3;
    }
    document.getElementById('keypad').innerHTML =
      ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(k){
        return k ? '<button class="key" data-key="' + k + '">' + k + '</button>' : '<span></span>';
      }).join('');
    renderDots();

    document.getElementById('keypad').addEventListener('click', function(e){
      var b = e.target.closest('[data-key]');
      if (!b) return;
      var k = b.getAttribute('data-key');
      err.textContent = '';
      if (k === '⌫') pass.code = pass.code.slice(0, -1);
      else if (pass.code.length < 6) pass.code += k;
      renderDots();
    });

    function attempt(){
      if (!pass.code) return;
      var u = Auth.login(currentRole, pass.code);
      if (u){
        pass.code = '';
        boot(u);
      } else {
        err.textContent = 'Wrong passcode for ' + Auth.roleLabel(currentRole) + '. Try again.';
        pass.code = '';
        renderDots();
      }
    }
    unlock.addEventListener('click', attempt);

    function loginKey(ev){
      if (!loginVisible()) return;
      if (/^[0-9]$/.test(ev.key)){ pass.code += ev.key; renderDots(); }
      else if (ev.key === 'Backspace'){ pass.code = pass.code.slice(0,-1); renderDots(); }
      else if (ev.key === 'Enter'){ attempt(); }
    }
    document.addEventListener('keydown', loginKey);
    document._loginKey = loginKey;

    Array.prototype.forEach.call(document.querySelectorAll('#role-picker .role-card'), function(card){
      card.addEventListener('click', function(){
        currentRole = card.getAttribute('data-role');
        Array.prototype.forEach.call(document.querySelectorAll('#role-picker .role-card'), function(c){ c.classList.remove('active'); });
        card.classList.add('active');
        document.getElementById('pass-role-label').textContent = 'Enter ' + Auth.roleLabel(currentRole) + ' passcode';
        passArea.classList.remove('hidden');
        err.textContent = '';
        var first = passArea.querySelector('.keypad .key');
        if (first) first.focus({ preventScroll:true });
      });
    });
    document.getElementById('btn-back-roles').addEventListener('click', function(){
      passArea.classList.add('hidden');
      Array.prototype.forEach.call(document.querySelectorAll('#role-picker .role-card'), function(c){ c.classList.remove('active'); });
    });
  }
  function loginVisible(){ return !document.getElementById('app').classList.contains('hidden'); }

  /* ---------------- boot ---------------- */
  function boot(u){
    var s = Store.get();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    document.getElementById('brand-name').textContent = s.settings.gymName;
    document.getElementById('user-name').textContent = u.name;
    document.getElementById('user-role').textContent = Auth.roleLabel(u.role);
    document.getElementById('user-avatar').textContent = (u.name.trim().split(' ')[0] || '?')[0].toUpperCase();
    document.getElementById('topbar-date').textContent =
      new Date().toLocaleDateString('en-PK', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) + ' · ' + s.settings.gymName;

    var kb = Math.round(Store.storageSize() / 102.4) / 10;
    document.getElementById('storage-size').textContent = (kb >= 10 ? Math.round(kb) : kb.toFixed(1)) + ' KB';

    document.getElementById('btn-logout-top').innerHTML = UI.icon('logout', 15);
    function logoutFlow(){
      UI.confirmAction('Log out', 'End your session?', function(){
        Auth.logout();
        location.reload();
      }, 'Log out');
    }
    document.getElementById('btn-logout').addEventListener('click', logoutFlow);
    document.getElementById('btn-logout-top').addEventListener('click', logoutFlow);

    renderSidebar();
    nav('dashboard');
    setupPalette();
    themeInit();
  }

  function renderSidebar(){
    var navEl = document.getElementById('nav');
    var items = Auth.menu();
    var html = '';
    items.forEach(function(m){
      if (m.id === 'checkin') html += '<div class="nav-label-sec">Operations</div>';
      if (m.id === 'pos') html += '<div class="nav-label-sec">Business</div>';
      if (m.id === 'settings') html += '<div class="nav-label-sec">System</div>';
      html += '<a class="nav-item" data-view="' + m.id + '">' + UI.icon(m.icon, 17) +
        '<span class="nav-label">' + UI.esc(m.label) + '</span></a>';
    });
    navEl.innerHTML = html;
    navEl.onclick = function(e){
      var it = e.target.closest('.nav-item');
      if (it) nav(it.getAttribute('data-view'));
    };
  }

  function nav(view, params){
    if (!Auth.canAccess(view)){
      view = 'dashboard';
      if (!Auth.canAccess(view)){
        document.getElementById('view').innerHTML = '<div class="empty-state">Access denied for your role.</div>';
        return;
      }
    }
    currentView = view;
    var it = Auth.MENU.find(function(m){ return m.id === view; });
    var label = it ? it.label : view;
    if (Auth.current().role === 'trainer' && it && it.trainerLabel) label = it.trainerLabel;
    document.getElementById('view-title').textContent = label;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(n){
      n.classList.toggle('active', n.getAttribute('data-view') === view);
    });
    if (Views[view]) Views[view](params || {});
    else document.getElementById('view').innerHTML = '<div class="empty-state">View not found.</div>';
    window.scrollTo(0, 0);
  }

  /* ---------------- command palette ---------------- */
  function setupPalette(){
    var root = document.getElementById('palette-root');
    var open = false;
    var selected = -1;

    function paletteItems(q){
      q = (q || '').toLowerCase();
      var s = Store.get();
      var u = Auth.current();
      var items = [];

      Auth.menu().forEach(function(m){
        if (m.label.toLowerCase().indexOf(q) > -1 || (!q && items.length < 6)){
          items.push({ kind:'view', view:m.id, icon:m.icon, title:m.label, sub:'Open view' });
        }
      });

      s.members.forEach(function(m){
        if (!q || m.name.toLowerCase().indexOf(q) > -1 || (m.phone||'').replace(/\s/g,'').indexOf(q.replace(/\s/g,'')) > -1){
          items.push({ kind:'member', id:m.id, icon:'user', title:m.name, sub:m.plan + ' · ' + (m.phone||'no phone') });
        }
      });
      if (!q) items = items.slice(0, 20);

      if (q){
        if (Auth.canAccess('members') && /add|new member/.test(q)) items.push({ kind:'nav', view:'members', act:'add', icon:'plus', title:'Add member', sub:'Members' });
        if (Auth.canAccess('pos') && /sale|pos|store/.test(q)) items.push({ kind:'nav', view:'pos', act:'checkout', icon:'cart', title:'New POS sale', sub:'Store & POS' });
        if (Auth.canAccess('finance') && /expense|transaction/.test(q)) items.push({ kind:'nav', view:'finance', act:'add-tx', icon:'banknote', title:'Add transaction', sub:'Finances' });
      }
      return items;
    }

    function renderPalette(q){
      var items = paletteItems(q);
      selected = items.length ? 0 : -1;
      var html = '';
      var lastSec = '';
      items.forEach(function(it, i){
        var sec = it.kind === 'view' ? 'Views' : (it.kind === 'member' ? 'Members' : 'Actions');
        if (sec !== lastSec){ html += '<div class="pal-sec">' + sec + '</div>'; lastSec = sec; }
        html += '<div class="pal-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' +
          '<span class="p-ic">' + UI.icon(it.icon, 16) + '</span>' +
          '<span class="p-main"><b>' + UI.esc(it.title) + '</b><span class="p-sub">' + UI.esc(it.sub || '') + '</span></span>' +
          (it.kind === 'member' ? UI.badge(Store.statusOf(Store.member(it.id))) : '') +
          '</div>';
      });
      document.getElementById('pal-results').innerHTML = html || '<div class="pal-empty">No matches found</div>';
      Array.prototype.forEach.call(document.querySelectorAll('#palette-root .pal-item'), function(el){
        el.addEventListener('mouseenter', function(){
          selected = +el.getAttribute('data-i');
          highlight();
        });
        el.addEventListener('click', function(){ runItem(items[+el.getAttribute('data-i')]); });
      });
    }
    function highlight(){
      Array.prototype.forEach.call(document.querySelectorAll('#palette-root .pal-item'), function(el, i){
        el.classList.toggle('sel', i === selected);
      });
      var el = document.querySelector('#palette-root .pal-item.sel');
      if (el) el.scrollIntoView({ block:'nearest' });
    }
    function runItem(it){
      close();
      if (!it) return;
      if (it.kind === 'view') nav(it.view);
      else if (it.kind === 'nav') nav(it.view, { open: it.act });
      else if (it.kind === 'member'){
        var m = Store.member(it.id);
        if (m && Views.openMember) Views.openMember(m);
      }
    }
    function openPalette(){
      open = true;
      root.innerHTML = '<div class="palette-overlay"><div class="palette">' +
        '<div class="palette-input-row">' + UI.icon('search', 17) +
        '<input class="palette-input" id="pal-input" placeholder="Search members, views, actions…" />' +
        '<kbd style="font-size:10.5px;color:var(--text-4)">ESC</kbd></div>' +
        '<div class="palette-results" id="pal-results"></div></div></div>';
      var input = document.getElementById('pal-input');
      renderPalette('');
      input.focus();
      input.addEventListener('input', function(){ renderPalette(input.value); });
      input.addEventListener('keydown', function(e){
        var items = paletteItems(input.value);
        if (e.key === 'ArrowDown'){ e.preventDefault(); selected = Math.min(selected + 1, items.length - 1); highlight(); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); selected = Math.max(selected - 1, 0); highlight(); }
        else if (e.key === 'Enter'){ e.preventDefault(); runItem(items[selected]); }
        else if (e.key === 'Escape'){ close(); }
      });
      root.querySelector('.palette-overlay').addEventListener('mousedown', function(e){
        if (e.target.classList.contains('palette-overlay')) close();
      });
    }
    function close(){ root.innerHTML = ''; open = false; }

    document.addEventListener('keydown', function(e){
      if (!loginVisible()) return; // still on the login screen
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
        e.preventDefault();
        if (!Auth.current()) return;
        if (open) close(); else openPalette();
      } else if (e.key === 'Escape'){
        if (open){ close(); return; }
        var mroot = document.getElementById('modal-root');
        if (mroot && mroot.children.length){
          UI.closeOverlay();
        }
      }
    });
    document.getElementById('top-search').addEventListener('click', function(){
      if (Auth.current()) openPalette();
    });
  }

  /* ---------------- init ---------------- */
  document.addEventListener('DOMContentLoaded', function(){
    Store.get();
    if (Auth.current()){
      boot(Auth.current());
    } else {
      renderLogin();
    }
    themeInit();
  });

  function refresh(){ try { if (currentView) nav(currentView); } catch(e){} }

  return { nav: nav, chart: chart, boot: boot, refresh: refresh };
})();

<!-- ============================================================
     Cloud sync — Firebase (real-time, free Spark plan)
     Collections: users, members, products, transactions, sales,
     attendance, plans, shifts, lockers  +  meta/main doc
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
window.Cloud = (function(){
  'use strict';
  var CONFIG = {
    apiKey: "AIzaSyB9hXkPx1VikvtWfKbvwvAMf4Yt4vAVWRM",
    authDomain: "gymcity-36b31.firebaseapp.com",
    projectId: "gymcity-36b31",
    storageBucket: "gymcity-36b31.firebasestorage.app",
    messagingSenderId: "233963370076",
    appId: "1:233963370076:web:144558b807a019c1db9899"
  };
  var COLS = ['users','members','products','transactions','sales','attendance','plans','shifts','lockers'];
  var db = null, booted = false, pushTimer = null;
  var synced = {}, syncedMeta = null, received = {};
  var firstPayloads = {}, firstMeta = null;

  function setStatus(kind, text){
    var el = document.getElementById('cloud-pill');
    if (!el){
      el = document.createElement('div');
      el.id = 'cloud-pill';
      el.style.cssText = 'position:fixed;left:14px;bottom:14px;z-index:99999;display:flex;align-items:center;gap:7px;background:rgba(11,18,32,.92);color:#e6edf3;border:1px solid rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;font:600 12px Inter,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none';
      document.body.appendChild(el);
    }
    var dot = { live:'#10b981', sync:'#f59e0b', off:'#64748b', err:'#ef4444' }[kind] || '#64748b';
    el.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + dot + '"></span>' + text;
  }

  /* ---------- outbound: local changes -> Firestore ---------- */
  function pushLocal(){
    if (!db || !booted || !window.Store) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(doPush, 120);
  }
  function doPush(){
    pushTimer = null;
    var s; try { s = Store.get(); } catch(e){ return; }
    try {
      var batch = db.batch(), ops = 0;
      COLS.forEach(function(c){
        var local = s[c] || [], map = synced[c] || {};
        local.forEach(function(e){
          if (!e || !e.id) return;
          var cur = JSON.stringify(e);
          if (map[e.id] !== cur){ batch.set(db.collection(c).doc(e.id), e); ops++; }
        });
        Object.keys(map).forEach(function(id){
          if (!local.some(function(x){ return x.id === id; })){ batch.delete(db.collection(c).doc(id)); ops++; }
        });
      });
      var metaObj = { settings: s.settings, activity: (s.activity || []).slice(-300), meta: s.meta };
      var metaCur = JSON.stringify(metaObj);
      if (syncedMeta !== metaCur){ batch.set(db.collection('meta').doc('main'), metaObj); ops++; }
      if (ops === 0) return;
      batch.commit().then(function(){
        COLS.forEach(function(c){
          synced[c] = {};
          (s[c] || []).forEach(function(e){ if (e && e.id) synced[c][e.id] = JSON.stringify(e); });
        });
        syncedMeta = metaCur;
      }).catch(function(err){ console.error('Cloud push failed', err); });
    } catch(e){ console.error('Cloud batch error', e); }
  }

  /* ---------- inbound: Firestore -> local + live re-render ---------- */
  function refreshUI(){
    try {
      if (!window.App || !window.Auth || !Auth.current()) return;
      var mroot = document.getElementById('modal-root');
      if (mroot && mroot.children.length) return;            // don't disturb open forms
      var ae = document.activeElement;
      if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return; // don't nuke typing
      App.refresh();
    } catch(e){}
  }
  function applyCollection(c, docs){
    var s; try { s = Store.get(); } catch(e){ return; }
    var serverMap = {}, i;
    for (i = 0; i < docs.length; i++) serverMap[docs[i].id] = docs[i].data;
    var out = [];
    (s[c] || []).forEach(function(e){
      if (e && serverMap[e.id] !== undefined){ out.push(serverMap[e.id]); delete serverMap[e.id]; }
    });
    for (var id in serverMap) out.push(serverMap[id]);
    s[c] = out;
    synced[c] = {};
    out.forEach(function(e){ if (e && e.id) synced[c][e.id] = JSON.stringify(e); });
    Store.save();
  }
  function applyMeta(d){
    if (!d) return;
    var s; try { s = Store.get(); } catch(e){ return; }
    if (d.settings) s.settings = d.settings;
    if (d.activity) s.activity = d.activity;
    if (d.meta) s.meta = d.meta;
    syncedMeta = JSON.stringify(d);
    Store.save();
  }
  function anyRemote(){
    for (var c in firstPayloads){ if (firstPayloads[c] && firstPayloads[c].length) return true; }
    return !!firstMeta;
  }
  function seedRemote(){
    var s; try { s = Store.get(); } catch(e){ return; }
    try {
      var batch = db.batch();
      COLS.forEach(function(c){
        (s[c] || []).forEach(function(e){ if (e && e.id) batch.set(db.collection(c).doc(e.id), e); });
      });
      batch.set(db.collection('meta').doc('main'), { settings: s.settings, activity: (s.activity || []).slice(-300), meta: s.meta });
      batch.commit().then(function(){
        COLS.forEach(function(c){
          synced[c] = {};
          (s[c] || []).forEach(function(e){ if (e && e.id) synced[c][e.id] = JSON.stringify(e); });
        });
        syncedMeta = JSON.stringify({ settings: s.settings, activity: (s.activity || []).slice(-300), meta: s.meta });
        setStatus('live', 'Live — synced');
      }).catch(function(err){ console.error('Cloud seed failed', err); setStatus('err', 'Cloud sync error'); });
    } catch(e){ console.error(e); setStatus('err', 'Cloud sync error'); }
  }
  function onFirst(){
    var total = COLS.length + 1;
    var done = 0;
    COLS.forEach(function(c){ if (received[c]) done++; });
    if (received.__meta) done++;
    if (done < total) return;
    booted = true;
    if (!anyRemote()){
      seedRemote();
    } else {
      COLS.forEach(function(c){ applyCollection(c, firstPayloads[c] || []); });
      if (firstMeta) applyMeta(firstMeta);
      refreshUI();
      setStatus('live', 'Live — synced');
    }
  }
  function startSubs(){
    COLS.forEach(function(c){
      db.collection(c).onSnapshot(function(snap){
        var docs = [];
        snap.forEach(function(doc){ docs.push({ id: doc.id, data: doc.data() }); });
        if (!booted){
          if (!received[c]){ received[c] = true; firstPayloads[c] = docs; onFirst(); }
        } else {
          applyCollection(c, docs);
          refreshUI();
        }
      }, function(err){
        console.error('Cloud subscribe error', c, err);
        if (!received[c]){ received[c] = true; firstPayloads[c] = []; onFirst(); }
        setStatus('err', 'Cloud sync error');
      });
    });
    db.collection('meta').doc('main').onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      if (!booted){
        if (!received.__meta){ received.__meta = true; firstMeta = d; onFirst(); }
      } else if (d) {
        applyMeta(d);
        refreshUI();
      }
    }, function(err){
      console.error('Cloud subscribe error', 'meta', err);
      if (!received.__meta){ received.__meta = true; firstMeta = null; onFirst(); }
      setStatus('err', 'Cloud sync error');
    });
  }
  function init(){
    if (!window.firebase){ setStatus('err', 'Cloud SDK blocked'); return; }
    try { firebase.initializeApp(CONFIG); } catch(e){ return; }
    db = firebase.firestore();
    try { db.enablePersistence(); } catch(e){}
    setStatus('sync', 'Connecting…');
    try {
      firebase.auth().signInAnonymously().then(function(){
        startSubs();
      }).catch(function(err){
        console.error('Cloud auth failed — enable Anonymous sign-in in Firebase console', err);
        setStatus('err', 'Cloud off — enable Anonymous auth + rules');
      });
    } catch(e){ console.error(e); setStatus('err', 'Cloud off'); }
  }

  return { pushLocal: pushLocal, init: init };
})();
document.addEventListener('DOMContentLoaded', function(){ setTimeout(function(){ Cloud.init(); }, 300); });
</script>
