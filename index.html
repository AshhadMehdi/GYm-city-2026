<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GYM City — Gym Management System</title>
  <meta name="description" content="GYM City's gym management system — member tracking, POS billing, trainer management and finance dashboards in one app."/>
  <meta name="theme-color" content="#ffffff"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="GYM City — Gym Management System"/>
  <meta property="og:description" content="Member tracking, POS billing, trainer management and finance — one app for GYM City."/>
  <style>html,body{overflow-x:hidden}</style>

  <style>
/* ============================================================
   GymFlow — Professional design system
   Light (default) + Dark themes via html[data-theme]
   ============================================================ */
*{ box-sizing:border-box; margin:0; padding:0; }

/* ---------- Theme tokens ---------- */
:root, html[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f4f8;
  --border:#e4e8ee; --border-strong:#d0d7e0;
  --text:#0f172a; --text-2:#475467; --text-3:#667085; --text-4:#98a2b3;
  --accent:#059669; --accent-strong:#047857; --accent-soft:#ecfdf5; --accent-border:#a7f3d0;
  --danger:#dc2626; --danger-soft:#fef2f2; --danger-border:#fecaca;
  --warn:#b45309; --warn-soft:#fffbeb; --warn-border:#fde68a;
  --info:#0369a1; --info-soft:#f0f9ff;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 14px rgba(16,24,40,.07);
  --shadow-lg:0 18px 50px rgba(16,24,40,.16);
  --ring:0 0 0 3px rgba(5,150,105,.16);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#0c1016; --surface:#141a22; --surface-2:#1a212c; --surface-3:#202837;
  --border:#242e3a; --border-strong:#33415596;
  --text:#e6edf3; --text-2:#aab6c7; --text-3:#7e8ba0; --text-4:#5b6879;
  --accent:#10b981; --accent-strong:#34d399; --accent-soft:rgba(16,185,129,.12); --accent-border:rgba(16,185,129,.35);
  --danger:#f87171; --danger-soft:rgba(239,68,68,.12); --danger-border:rgba(239,68,68,.3);
  --warn:#fbbf24; --warn-soft:rgba(245,158,11,.12); --warn-border:rgba(245,158,11,.3);
  --info:#38bdf8; --info-soft:rgba(56,189,248,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(16,185,129,.22);
  color-scheme: dark;
}

html,body{ height:100%; }
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; font-size:14px; color:var(--text); }
kbd{ font-family:inherit; }
.hidden{ display:none !important; }
.muted{ color:var(--text-3); }
.small{ font-size:12.5px; }
.center{ text-align:center; }
.mt{ margin-top:14px; }
.mb{ margin-bottom:14px; }
.sep{ border:none; border-top:1px solid var(--border); margin:16px 0; }
code{ background:var(--surface-3); border:1px solid var(--border); padding:2px 7px; border-radius:6px; font-size:12.5px; color:var(--accent-strong); }
a{ color:var(--accent-strong); }
.ic{ vertical-align:-3px; flex-shrink:0; }

/* ================= LOGIN ================= */
.login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(900px 460px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(700px 420px at 0% 110%, var(--info-soft), transparent 55%),
    var(--bg);
  padding:24px;
}
.login-card{
  width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
  border-radius:18px; padding:32px 30px 24px; box-shadow:var(--shadow-lg); text-align:center;
}
.login-brand{ display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:22px; }
.brand-mark{
  width:44px; height:44px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent-strong); border:1px solid var(--accent-border);
}
.login-brand .brand-mark{ width:48px; height:48px; }
.login-title{ font-size:24px; font-weight:800; letter-spacing:-.4px; text-align:left; line-height:1.2; }
.login-tag{ font-size:12.5px; color:var(--text-3); text-align:left; }
.role-picker{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
.role-card{
  background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:14px 6px 12px;
  cursor:pointer; color:var(--text-2); transition:.15s; display:flex; flex-direction:column; align-items:center; gap:7px;
  font-weight:600; font-size:13px;
}
.role-card svg{ color:var(--text-4); }
.role-card:hover{ border-color:var(--border-strong); }
.role-card.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); box-shadow:var(--ring); }
.role-card.active svg{ color:var(--accent-strong); }
.passcode-area{ text-align:left; animation:fadeUp .18s ease; }
@keyframes fadeUp{ from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
.pass-head{ display:flex; align-items:center; justify-content:space-between; font-weight:600; margin-bottom:12px; font-size:13.5px; }
.link-btn{ background:none; border:none; color:var(--text-3); font-size:12.5px; cursor:pointer; }
.link-btn:hover{ color:var(--accent-strong); }
.pass-display{
  background:var(--surface-3); border:1px solid var(--border); border-radius:11px;
  padding:15px; display:flex; justify-content:center; gap:10px; margin-bottom:14px;
}
.dot{ width:11px; height:11px; border-radius:50%; background:var(--border-strong); }
.dot.on{ background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.key{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:13px 0; font-size:16px; font-weight:600; cursor:pointer; transition:.12s;
}
.key:hover{ border-color:var(--border-strong); background:var(--surface-3); }
.key:active{ transform:scale(.96); }
.login-error{ color:var(--danger); font-size:12.5px; min-height:18px; margin-top:10px; }
.login-hint{ margin-top:18px; color:var(--text-4); font-size:12px; }

/* ================= LAYOUT ================= */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:248px; position:fixed; inset:0 auto 0 0; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:40;
}
.brand{ display:flex; align-items:center; gap:11px; padding:18px 16px 14px; font-size:16.5px; font-weight:800; letter-spacing:-.3px; }
.brand-name{ white-space:nowrap; }
.nav{ flex:1; overflow-y:auto; padding:6px 10px; display:flex; flex-direction:column; gap:2px; }
.nav-label-sec{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text-4); padding:14px 12px 6px; }
.nav-item{
  position:relative; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px;
  color:var(--text-3); cursor:pointer; font-weight:500; font-size:13.5px; transition:.13s;
}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
.nav-item.active::before{ content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--accent); }
.nav-item svg{ color:inherit; }
.sidebar-foot{ padding:14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
.storage-pill{
  display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-4);
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px;
}
.sp-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }

.main{ margin-left:248px; flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  height:60px; position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:0 24px; background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.topbar-title h2{ font-size:16.5px; font-weight:700; letter-spacing:-.2px; }
.topbar-date{ font-size:12px; color:var(--text-4); }
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.search-trigger{
  display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; padding:7px 10px; width:250px; color:var(--text-4); cursor:pointer; font-size:13px; transition:.15s;
}
.search-trigger:hover{ border-color:var(--border-strong); }
.search-trigger span{ flex:1; text-align:left; }
.search-trigger kbd{
  background:var(--surface-3); border:1px solid var(--border); border-radius:5px; padding:1px 6px;
  font-size:10.5px; color:var(--text-4); font-weight:600;
}
.user-chip{ display:flex; align-items:center; gap:10px; }
.user-meta{ display:flex; flex-direction:column; line-height:1.25; min-width:0; }
.user-name{ font-weight:600; font-size:13px; white-space:nowrap; }
.user-role{ font-size:11px; color:var(--text-4); text-transform:uppercase; letter-spacing:.5px; }
.avatar{
  width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
  border:1px solid var(--accent-border); display:inline-flex; align-items:center; justify-content:center;
  font-weight:700; font-size:12.5px; flex-shrink:0;
}
#view{ padding:26px 24px 40px; max-width:1280px; width:100%; margin:0 auto; }

/* ================= PAGE HEAD ================= */
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h1{ font-size:21px; font-weight:700; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; }
.page-sub{ color:var(--text-3); font-size:13px; margin-top:2px; }
.page-actions{ display:flex; gap:9px; flex-wrap:wrap; }
.count-pill{ background:var(--surface-3); border:1px solid var(--border); color:var(--text-2); font-size:12.5px; padding:1px 9px; border-radius:20px; font-weight:600; }

/* ================= CARDS ================= */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
  padding:20px; box-shadow:var(--shadow-sm);
}
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.card-head h3{ font-size:14.5px; font-weight:600; letter-spacing:-.2px; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.grid-checkin{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-settings{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text-4); margin:22px 0 12px; }

/* ================= STAT CARDS ================= */
.stat-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px;
  display:flex; flex-direction:column; gap:2px; position:relative; transition:.15s; cursor:pointer;
}
.stat-card:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.stat-icon{
  width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
  margin-bottom:8px; background:var(--surface-3); color:var(--text-2);
}
.stat-icon.green{ background:var(--accent-soft); color:var(--accent-strong); }
.stat-icon.amber{ background:var(--warn-soft); color:var(--warn); }
.stat-icon.red{ background:var(--danger-soft); color:var(--danger); }
.stat-icon.blue{ background:var(--info-soft); color:var(--info); }
.stat-value{ font-size:22px; font-weight:700; letter-spacing:-.4px; }
.stat-label{ color:var(--text-3); font-size:12.5px; }
.stat-trend{ font-size:11.5px; color:var(--text-4); margin-top:2px; }
.tone-green{ color:var(--accent-strong); } .tone-amber{ color:var(--warn); } .tone-red{ color:var(--danger); } .tone-blue{ color:var(--info); }

/* ================= BADGES / METER ================= */
.badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  padding:3px 10px; border-radius:20px; white-space:nowrap; line-height:1.3;
}
.bdot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.b-active{ background:var(--accent-soft); color:var(--accent-strong); }
.b-expiring{ background:var(--warn-soft); color:var(--warn); }
.b-overdue{ background:var(--danger-soft); color:var(--danger); }
.b-inactive{ background:var(--surface-3); color:var(--text-3); }
.meter{ display:flex; flex-direction:column; gap:4px; min-width:120px; }
.meter-track{ height:5px; border-radius:4px; background:var(--surface-3); overflow:hidden; }
.meter-fill{ height:100%; border-radius:4px; transition:width .3s; }
.meter-label{ font-size:10.5px; font-weight:600; }

/* ================= BUTTONS ================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-2); border-radius:9px; padding:9px 15px; font-weight:600;
  cursor:pointer; transition:.13s; font-size:13px; white-space:nowrap; box-shadow:var(--shadow-sm);
}
.btn:hover{ border-color:var(--border-strong); color:var(--text); }
.btn:active{ transform:translateY(.5px); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(5,150,105,.4); }
.btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
.btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-danger:hover{ filter:brightness(1.07); color:#fff; }
.btn-ghost{ background:transparent; box-shadow:none; color:var(--text-3); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--text); }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
.btn-block{ width:100%; justify-content:center; }
.icon-btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-3); width:32px; height:32px;
  border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:.13s; flex-shrink:0;
}
.icon-btn:hover{ border-color:var(--border-strong); color:var(--text); }
.icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger-border); background:var(--danger-soft); }
.icon-btn.primary-soft:hover{ color:var(--accent-strong); border-color:var(--accent-border); background:var(--accent-soft); }

/* ================= FORMS ================= */
.toolbar{ display:flex; gap:9px; flex-wrap:wrap; padding:14px; border-bottom:1px solid var(--border); align-items:center; }
.search-input, .input{
  background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:8.5px 12px;
  outline:none; transition:.15s; color:var(--text); width:100%;
}
.search-input{ min-width:210px; flex:1; }
.search-input:focus, .input:focus{ border-color:var(--accent); box-shadow:var(--ring); }
.input{ margin-top:0; }
input[type="date"].input{ min-height:38px; }
textarea.input{ resize:vertical; min-height:46px; }
.select{
  background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:8.5px 10px;
  outline:none; cursor:pointer; color:var(--text); transition:.15s;
}
.select:focus{ border-color:var(--accent); box-shadow:var(--ring); }
.field{ margin-bottom:13px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-3); margin-bottom:5px; }
.field .hint{ font-size:11.5px; color:var(--text-4); margin-top:3px; }
.form-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.form-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px; }
.btn-row{ display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }

/* ================= TABLES ================= */
.table-wrap{ overflow-x:auto; }
.table{ width:100%; border-collapse:collapse; }
.table th{
  text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;
  color:var(--text-4); padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.table td{ padding:12px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13.5px; }
.table tbody tr{ transition:background .1s; }
.table tbody tr:hover{ background:var(--surface-2); }
.table tbody tr.clickable-row{ cursor:pointer; }
.table tbody tr.clickable-row:hover{ background:var(--accent-soft); }
.table tbody tr:last-child td{ border-bottom:none; }
.empty-td{ text-align:center; color:var(--text-4); padding:32px !important; }
.cell-user{ display:flex; align-items:center; gap:10px; }
.cell-user > div{ display:flex; flex-direction:column; line-height:1.3; }
.cell-user b{ font-weight:600; }
.plan-chip{
  background:var(--surface-3); border:1px solid var(--border); border-radius:7px;
  padding:2px 9px; font-size:12px; font-weight:600; color:var(--text-2); white-space:nowrap;
}
.td-status{ min-width:170px; }
.row-actions{ display:flex; gap:4px; align-items:center; justify-content:flex-end; }
.row-actions .icon-btn{ width:29px; height:29px; background:transparent; border-color:transparent; opacity:.65; }
.row-actions .icon-btn:hover{ opacity:1; background:var(--surface-2); border-color:var(--border); }
.amt-pos{ color:var(--accent-strong); font-weight:600; }
.amt-neg{ color:var(--danger); font-weight:600; }
.numeric{ text-align:right; }
.th-numeric{ text-align:right; }

/* ================= LISTS ================= */
.list{ display:flex; flex-direction:column; gap:8px; }
.list-row{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:11px; padding:11px 14px; transition:.13s;
}
.list-row:hover{ border-color:var(--border-strong); }
.list-main{ display:flex; align-items:center; gap:11px; flex:1; min-width:0; }
.list-main > div{ display:flex; flex-direction:column; line-height:1.3; min-width:0; }
.list-main b{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-click{ cursor:pointer; }
.list-click:hover{ border-color:var(--accent-border); box-shadow:var(--shadow-sm); }

/* ================= MODALS / OVERLAYS ================= */
.overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; z-index:100; padding:7vh 16px; overflow-y:auto;
}
.modal{
  background:var(--surface); border:1px solid var(--border-strong); border-radius:15px; width:100%; max-width:540px;
  box-shadow:var(--shadow-lg); animation:fadeUp .16s ease; margin-bottom:7vh;
}
.modal-lg{ max-width:780px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
.modal-head h3{ font-size:15px; font-weight:700; letter-spacing:-.2px; }
.modal-body{ padding:20px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:9px; padding:14px 20px; border-top:1px solid var(--border); }
.confirm-body{ display:flex; gap:12px; align-items:flex-start; }
.confirm-ic{ width:34px; height:34px; border-radius:10px; background:var(--danger-soft); color:var(--danger); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.confirm-body p{ font-size:13.5px; color:var(--text-2); }

/* ================= DRAWER ================= */
.overlay .drawer{
  background:var(--surface); border:1px solid var(--border-strong); border-radius:0; width:100%; max-width:430px;
  box-shadow:var(--shadow-lg); animation:slideL .22s ease; align-self:stretch; margin-left:auto; display:flex; flex-direction:column;
}
@keyframes slideL{ from{transform:translateX(40px);opacity:0} to{transform:none;opacity:1} }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
.drawer-head h3{ font-size:15px; font-weight:700; }
.drawer-body{ padding:20px; overflow-y:auto; flex:1; }
.drawer-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:9px; flex-wrap:wrap; }

/* ================= TOASTS ================= */
#toast-root{ position:fixed; bottom:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:9px; }
.toast{
  display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border-strong);
  color:var(--text-2); padding:11px 14px; border-radius:11px; box-shadow:var(--shadow-lg);
  font-size:13px; font-weight:500; max-width:360px; transition:.3s; cursor:pointer;
}
.toast svg{ color:var(--info); }
.toast.success svg{ color:var(--accent); }
.toast.error svg{ color:var(--danger); }
.toast .tt{ flex:1; }
.toast-action{ background:var(--accent-soft); color:var(--accent-strong); border:1px solid var(--accent-border); border-radius:7px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.toast.out{ opacity:0; transform:translateX(16px); }

/* ================= COMMAND PALETTE ================= */
.palette-overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; z-index:200; padding:12vh 16px 20px;
}
.palette{
  width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden; animation:fadeUp .14s ease; max-height:70vh; display:flex; flex-direction:column;
}
.palette-input-row{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.palette-input{
  flex:1; border:none; outline:none; background:transparent; font-size:15px; color:var(--text);
}
.palette-results{ overflow-y:auto; padding:8px; }
.pal-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; cursor:pointer; font-size:13.5px;
}
.pal-item:hover{ background:var(--surface-2); }
.pal-item.sel{ background:var(--accent-soft); color:var(--accent-strong); }
.pal-item .p-ic{ width:30px; height:30px; border-radius:8px; background:var(--surface-3); display:inline-flex; align-items:center; justify-content:center; color:var(--text-3); flex-shrink:0; }
.pal-item.sel .p-ic{ background:var(--accent); color:#fff; }
.pal-item .p-main{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.pal-item .p-sub{ font-size:11.5px; color:var(--text-4); }
.pal-sec{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text-4); padding:10px 12px 4px; }
.pal-empty{ padding:24px; text-align:center; color:var(--text-4); font-size:13px; }

/* ================= CHARTS ================= */
.chart-box{ position:relative; height:240px; }
.chart-box p{ text-align:center; padding-top:90px; color:var(--text-4); font-size:12.5px; }

/* ================= TABS ================= */
.tabs{ display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--border); }
.tab{
  background:none; border:none; border-bottom:2px solid transparent; padding:8px 12px; font-size:13px;
  font-weight:600; color:var(--text-3); cursor:pointer; margin-bottom:-1px;
}
.tab:hover{ color:var(--text); }
.tab.active{ color:var(--accent-strong); border-bottom-color:var(--accent); }

/* ================= QR ================= */
.qr-box{ text-align:center; margin-bottom:14px; }
.qr-img{ width:210px; height:210px; border-radius:12px; border:1px solid var(--border); background:#fff; padding:10px; }

/* ================= PLANS ================= */
.plan-day{ display:flex; gap:10px; margin-bottom:8px; align-items:flex-start; }
.plan-day-label{ width:112px; flex-shrink:0; font-size:12.5px; font-weight:600; padding-top:9px; color:var(--text-3); }
.plan-textarea{ min-height:56px; }
.plan-text{
  white-space:pre-wrap; font-family:inherit; font-size:13px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:12px; padding:16px; max-height:420px; overflow-y:auto; color:var(--text-2);
}

/* ================= POS ================= */
.product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:13px; }
.product-card{
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
  padding:18px 16px 15px; display:flex; flex-direction:column; align-items:center; gap:5px; transition:.15s;
}
.product-card:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); transform:translateY(-2px); }
.p-emoji{
  width:44px; height:44px; border-radius:11px; background:var(--surface-3); color:var(--text-2);
  display:flex; align-items:center; justify-content:center; margin-bottom:4px;
}
.p-name{ font-weight:600; font-size:13px; line-height:1.35; text-align:center; min-height:35px; display:flex; align-items:center; }
.p-price{ font-weight:700; color:var(--accent-strong); font-size:14px; }
.stock-badge{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; }
.st-ok{ background:var(--accent-soft); color:var(--accent-strong); }
.st-low{ background:var(--warn-soft); color:var(--warn); }
.st-out{ background:var(--danger-soft); color:var(--danger); }
.checkout-cust{ display:flex; gap:8px; margin-bottom:14px; }
.cust-btn{
  flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:10px; font-weight:600; cursor:pointer; color:var(--text-3); display:flex; align-items:center; justify-content:center; gap:8px;
}
.cust-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
.co-total{
  display:flex; justify-content:space-between; align-items:center; background:var(--surface-2);
  border:1px solid var(--border); border-radius:11px; padding:13px 16px; margin-top:12px; font-size:14px; font-weight:600;
}
.co-total b{ font-size:19px; color:var(--accent-strong); }
.qty{ display:flex; align-items:center; gap:8px; }
.qty span{ font-weight:600; min-width:20px; text-align:center; }
.receipt{ font-family:'Inter',sans-serif; font-size:13px; color:var(--text); }
.receipt .r-head{ text-align:center; border-bottom:1px dashed var(--border); padding-bottom:12px; margin-bottom:12px; }
.receipt .r-head b{ font-size:16px; }
.receipt .r-row{ display:flex; justify-content:space-between; gap:12px; padding:2.5px 0; }
.receipt .r-rule{ border-top:1px dashed var(--border); margin:10px 0; }

/* ================= SCHEDULE ================= */
.schedule-table th, .schedule-table td{ text-align:center; }
.shift-cell{ min-width:108px; }
.shift-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--accent-strong);
  font-size:11.5px; font-weight:600; border-radius:7px; padding:3px 7px; margin:1.5px; border:1px solid var(--accent-border);
}
.shift-x{ background:none; border:none; color:inherit; cursor:pointer; font-size:10px; opacity:.5; padding:0 2px; line-height:1; }
.shift-x:hover{ opacity:1; }

/* ================= LOCKERS ================= */
.locker-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:13px; }
.locker-card{ background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px; transition:.15s; }
.locker-card:hover{ box-shadow:var(--shadow-md); }
.locker-card.lk-occupied{ border-left:4px solid var(--accent); }
.locker-card.lk-overdue{ border-left:4px solid var(--danger); }
.locker-card.lk-vacant{ border-left:4px solid var(--border-strong); opacity:.88; }
.lk-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.lk-num{ font-weight:700; font-size:14px; }
.lk-mem{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.lk-mem > div{ display:flex; flex-direction:column; line-height:1.3; }
.lk-meta{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-3); margin-bottom:12px; flex-wrap:wrap; gap:4px; }
.lk-meta b{ color:var(--text); font-weight:600; }

/* ================= DRAWER: member profile ================= */
.profile-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.profile-head .avatar{ width:52px; height:52px; font-size:18px; border-radius:14px; }
.profile-name{ font-size:18px; font-weight:700; letter-spacing:-.3px; }
.profile-sub{ font-size:12.5px; color:var(--text-3); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.details-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
.detail-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.detail-item .k{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-4); margin-bottom:2px; }
.detail-item .v{ font-weight:600; font-size:13.5px; }
.mini-head{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
.mini-head h4{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-4); }
.mini-head a{ font-size:12px; }

/* ================= ACTIVITY / EMPTY ================= */
.empty-state{ text-align:center; color:var(--text-4); padding:60px 20px; font-size:14px; }
.empty-state .es-ic{ width:56px; height:56px; margin:0 auto 14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-4); }
.activity-row{ display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); }
.activity-row:last-child{ border-bottom:none; }
.activity-ic{ width:30px; height:30px; border-radius:8px; background:var(--surface-3); color:var(--text-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.activity-ic.green{ background:var(--accent-soft); color:var(--accent-strong); }
.activity-ic.red{ background:var(--danger-soft); color:var(--danger); }
.activity-ic.amber{ background:var(--warn-soft); color:var(--warn); }

/* ================= PRINT ================= */
@media print{
  body *{ visibility:hidden; }
  .print-area, .print-area *{ visibility:visible; }
  .print-area{ position:fixed; inset:0; overflow:visible; background:#fff !important; color:#000 !important; padding:24px; }
  .no-print{ display:none !important; }
}

/* ================= SCROLLBAR ================= */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-4); }

/* ================= RESPONSIVE ================= */
@media (max-width:1150px){
  .stat-grid{ grid-template-columns:repeat(3,1fr); }
  .grid-2, .grid-checkin, .grid-settings{ grid-template-columns:1fr; }
}
@media (max-width:920px){
  .sidebar{ width:64px; }
  .brand{ justify-content:center; padding:16px 0; }
  .brand-name, .nav-label, .sidebar-foot .storage-pill, .sidebar-foot .btn span{ display:none; }
  .nav-item{ justify-content:center; padding:11px 0; }
  .nav-item.active::before{ left:-10px; }
  .main{ margin-left:64px; }
  .search-trigger{ width:170px; }
  .search-trigger span{ display:none; }
  #view{ padding:18px 14px 32px; }
}
@media (max-width:600px){
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .form-grid-2, .form-grid-3{ grid-template-columns:1fr; }
  .topbar{ padding:0 12px; }
  .user-meta{ display:none; }
  .topbar-date{ display:none; }
}

        'Success starts with self-discipline.',
        'Small progress is still progress. Keep going!'
      ]
    };

    var activity = [
      { id:uid(), ts: now()-2*3600000, actor:'Salman Ahmed', text:'Renewed membership — Hamza Sheikh (Rs 2,500)' },
      { id:uid(), ts: now()-26*3600000, actor:'Rashid Ali',   text:'Completed POS sale — Rs 8,500' },
      { id:uid(), ts: now()-30*3600000, actor:'Salman Ahmed', text:'Added member — Noman Khalid' },
      { id:uid(), ts: now()-49*3600000, actor:'Salman Ahmed', text:'Paid gym hall rent — Rs 25,000' }
    ];

    return {
      settings: settings,
      users: [u_mgr, u_fd, u_t1, u_t2],
      members: members,
      products: products,
      transactions: tx,
      sales: [],
      attendance: attendance,
      plans: [],
      shifts: shifts,
      lockers: lockers,
      activity: activity,
      meta: { version:1, seededAt: now() }
    };
  }

  /* ---------------- persistence ---------------- */
  var data = null;

  function load(){
    if (data) return;
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    if (raw){ try { data = JSON.parse(raw); } catch(e){ data = null; } }
    if (!data || !data.members){ data = seed(); save(); }
    if (!data.activity) data.activity = [];
    if (!data.sales) data.sales = [];
    save();
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ console.error('Save failed', e); } if (window.Cloud && window.Cloud.pushLocal) window.Cloud.pushLocal(); }
  function get(){ load(); return data; }

  function importData(obj){ data = obj; save(); }
  function exportJSON(){ return JSON.stringify(get(), null, 2); }
  function resetDemo(){ data = seed(); save(); }
  function clearAll(){
    var s = get();
    data = { settings: s.settings, users: s.users, members: [], products: [],
             transactions: [], sales: [], attendance: [], plans: [], shifts: [],
             lockers: [], activity: [], meta: { version:1 } };
    save();
  }

  /* ---------------- activity / audit log ---------------- */
  function log(actor, text){
    get().activity.push({ id:uid(), ts:now(), actor:actor || 'System', text:text });
    if (get().activity.length > 300) get().activity = get().activity.slice(-300);
    save();
  }
  function activity(){ return get().activity.slice().sort(function(a,b){ return b.ts - a.ts; }); }

  /* ---------------- members ---------------- */
  function statusOf(m){
    if (!m || m.active === false) return 'inactive';
    var daysLeft = Math.ceil((m.renewal - today()) / DAY);
    if (daysLeft < 0) return 'overdue';
    if (daysLeft <= get().settings.reminderDays) return 'expiring';
    return 'active';
  }
  function member(id){ return get().members.find(function(m){ return m.id === id; }) || null; }
  function addMember(m, opts){
    opts = opts || {};
    if (!opts.keepId) m.id = uid();
    m.joinedAt = m.joinedAt || m.start || now();
    get().members.push(m);
    save();
    return m;
  }
  function updateMember(m){
    var arr = get().members;
    for (var i = 0; i < arr.length; i++){ if (arr[i].id === m.id){ arr[i] = m; save(); return; } }
  }
  function deleteMember(id){
    var s = get();
    var m = member(id);
    s.members = s.members.filter(function(x){ return x.id !== id; });
    s.attendance = s.attendance.filter(function(a){ return a.memberId !== id; });
    s.plans = s.plans.filter(function(p){ return p.memberId !== id; });
    s.lockers.forEach(function(l){ if (l.memberId === id) l.memberId = null; });
    save();
    return m;
  }
  function markPaid(m){
    var s = get();
    var fee = s.settings.planFee[m.plan] || 0;
    var base = Math.max(today(), m.renewal);
    m.renewal = base + (s.settings.planDays[m.plan] || 30) * DAY;
    updateMember(m);
    addTransaction({ type:'income', category:'Dues', amount:fee, desc:'Renewal — ' + m.name, memberId:m.id }, false);
    return fee;
  }
  function renewalsUpcoming(days){
    return get().members.filter(function(m){
      if (m.active === false) return false;
      var dl = Math.ceil((m.renewal - today()) / DAY);
      return dl >= 0 && dl <= days;
    }).sort(function(a,b){ return a.renewal - b.renewal; });
  }
  function memberPayments(id){
    return get().transactions.filter(function(t){ return t.memberId === id && t.type === 'income'; })
      .sort(function(a,b){ return b.ts - a.ts; });
  }

  /* ---------------- products / POS ---------------- */
  function addProduct(p){ p.id = uid(); get().products.push(p); save(); return p; }
  function updateProduct(p){
    var arr = get().products;
    for (var i = 0; i < arr.length; i++){ if (arr[i].id === p.id){ arr[i] = p; save(); return; } }
  }
  function deleteProduct(id){
    get().products = get().products.filter(function(p){ return p.id !== id; });
    save();
  }
  function sell(items, memberId, customerName){
    var s = get();
    var total = 0;
    items.forEach(function(it){
      var p = s.products.find(function(x){ return x.id === it.productId; });
      if (!p) return;
      p.stock -= it.qty;
      total += it.qty * p.price;
    });
    s.sales.push({ id:uid(), ts:now(), items:items, memberId:memberId || null, customer:customerName || '', total:total });
    addTransaction({ type:'income', category:'Supplements', amount:total,
      desc:'POS sale' + (customerName ? ' — ' + customerName : ''), memberId: memberId || null }, false);
    save();
    return total;
  }

  /* ---------------- transactions ---------------- */
  function addTransaction(t, shouldLog){
    t.id = uid(); t.ts = t.ts || now();
    get().transactions.push(t);
    save();
    if (shouldLog !== false && t.type === 'income' && t.category === 'Dues'){
      var actor = Auth.current ? Auth.current() : null;
      log(actor ? actor.name : 'System', 'Renewal payment — ' + (t.desc || ''));
    }
    return t;
  }
  function deleteTransaction(id){
    get().transactions = get().transactions.filter(function(t){ return t.id !== id; });
    save();
  }
  function revenueBetween(a, b){
    return get().transactions.filter(function(t){ return t.type === 'income' && t.ts >= a && t.ts < b; })
      .reduce(function(s, t){ return s + t.amount; }, 0);
  }
  function expensesBetween(a, b){
    return get().transactions.filter(function(t){ return t.type === 'expense' && t.ts >= a && t.ts < b; })
      .reduce(function(s, t){ return s + t.amount; }, 0);
  }
  function overdueDues(){
    var s = get();
    return s.members.reduce(function(sum, m){
      return sum + (statusOf(m) === 'overdue' ? (s.settings.planFee[m.plan] || 0) : 0);
    }, 0);
  }

  /* ---------------- attendance ---------------- */
  function checkIn(memberId){
    var rec = { id:uid(), ts:now(), memberId:memberId };
    get().attendance.push(rec); save(); return rec;
  }
  function deleteAttendance(id){
    get().attendance = get().attendance.filter(function(a){ return a.id !== id; });
    save();
  }
  function checkinsOn(ms){
    var d0 = startOfDay(ms), d1 = d0 + DAY;
    return get().attendance.filter(function(a){ return a.ts >= d0 && a.ts < d1; });
  }

  /* ---------------- plans ---------------- */
  function addPlan(p){ p.id = uid(); p.ts = now(); get().plans.push(p); save(); return p; }
  function deletePlan(id){ get().plans = get().plans.filter(function(p){ return p.id !== id; }); save(); }

  /* ---------------- shifts ---------------- */
  function addShift(s){ s.id = uid(); get().shifts.push(s); save(); return s; }
  function deleteShift(id){ get().shifts = get().shifts.filter(function(s){ return s.id !== id; }); save(); }

  /* ---------------- lockers ---------------- */
  function addLocker(l){ l.id = uid(); get().lockers.push(l); save(); return l; }
  function updateLocker(l){
    var arr = get().lockers;
    for (var i = 0; i < arr.length; i++){ if (arr[i].id === l.id){ arr[i] = l; save(); return; } }
  }
  function deleteLocker(id){ get().lockers = get().lockers.filter(function(l){ return l.id !== id; }); save(); }

  /* ---------------- users ---------------- */
  function user(id){ return get().users.find(function(u){ return u.id === id; }) || null; }
  function addUser(u){ u.id = uid(); get().users.push(u); save(); return u; }
  function updateUser(u){
    var arr = get().users;
    for (var i = 0; i < arr.length; i++){ if (arr[i].id === u.id){ arr[i] = u; save(); return; } }
  }
  function deleteUser(id){
    if (get().users.filter(function(u){ return u.role === 'manager'; }).length <= 1) return false;
    get().users = get().users.filter(function(u){ return u.id !== id; });
    save(); return true;
  }

  /* ---------------- CSV exports ---------------- */
  function csvEscape(v){
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }
  function csvFrom(rows){ return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\n'); }

  function exportMembersCSV(){
    var s = get();
    var head = ['Name','Phone','Plan','Start Date','Renewal Date','Status','Trainer','Fee','Notes'];
    var rows = s.members.map(function(m){
      var t = s.users.find(function(u){ return u.id === m.trainerId; });
      return [m.name, m.phone, m.plan,
        new Date(m.start).toLocaleDateString('en-CA'),
        new Date(m.renewal).toLocaleDateString('en-CA'),
        statusOf(m), t ? t.name : '', m.fee, (m.notes||'').replace(/\n/g,' ') ];
    });
    return csvFrom([head].concat(rows));
  }
  function exportTransactionsCSV(){
    var head = ['Date','Type','Category','Description','Amount','Member'];
    var rows = get().transactions.map(function(t){
      var m = t.memberId ? member(t.memberId) : null;
      return [ new Date(t.ts).toLocaleDateString('en-CA'), t.type, t.category, t.desc || '', t.amount, m ? m.name : '' ];
    });
    return csvFrom([head].concat(rows));
  }
  function exportAttendanceCSV(){
    var head = ['Date','Time','Member'];
    var rows = get().attendance.map(function(a){
      var m = member(a.memberId);
      return [ new Date(a.ts).toLocaleDateString('en-CA'), new Date(a.ts).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }), m ? m.name : '(deleted)' ];
    });
    return csvFrom([head].concat(rows));
  }
  function storageSize(){
    try { return (localStorage.getItem(KEY) || '').length; } catch(e){ return 0; }
  }

  return {
    DAY: DAY, uid: uid, now: now, today: today, daysFromNow: daysFromNow,
    startOfDay: startOfDay, monthRange: monthRange, PLAN_FEES: PLAN_FEES, PLAN_DAYS: PLAN_DAYS,
    get: get, save: save, importData: importData, exportJSON: exportJSON,
    resetDemo: resetDemo, clearAll: clearAll, storageSize: storageSize,
    log: log, activity: activity,
    statusOf: statusOf, member: member, addMember: addMember, updateMember: updateMember,
    deleteMember: deleteMember, markPaid: markPaid, renewalsUpcoming: renewalsUpcoming,
    memberPayments: memberPayments,
    addProduct: addProduct, updateProduct: updateProduct, deleteProduct: deleteProduct, sell: sell,
    addTransaction: addTransaction, deleteTransaction: deleteTransaction,
    revenueBetween: revenueBetween, expensesBetween: expensesBetween, overdueDues: overdueDues,
    checkIn: checkIn, deleteAttendance: deleteAttendance, checkinsOn: checkinsOn,

    addLocker: addLocker, updateLocker: updateLocker, deleteLocker: deleteLocker,

})();

/* ============================================================
   GymFlow — Authentication & Role-Based Access Control (RBAC)
   Icons: keys map to the UI icon library (see ui.js)
   ============================================================ */
window.Auth = (function(){
  'use strict';

  var MENU = [
    { id:'dashboard', label:'Dashboard',  icon:'grid',      roles:['manager','frontdesk','trainer'] },
    { id:'members',   label:'Members',    icon:'users',     roles:['manager','frontdesk','trainer'], trainerIcon:'user', trainerLabel:'Clients' },
    { id:'checkin',   label:'Attendance', icon:'qr',        roles:['manager','frontdesk','trainer'] },
    { id:'plans',     label:'Plans',      icon:'clipboard', roles:['manager','trainer'] },
    { id:'pos',       label:'Store & POS',icon:'cart',      roles:['manager','frontdesk'] },
    { id:'finance',   label:'Finances',   icon:'banknote',  roles:['manager'] },
    { id:'schedule',  label:'Schedule',   icon:'calendar',  roles:['manager'] },
    { id:'lockers',   label:'Lockers',    icon:'lock',      roles:['manager'] },
    { id:'settings',  label:'Settings',   icon:'settings',  roles:['manager'] }
  ];

  function current(){
    var id = localStorage.getItem('gymflow_session');
    return Store.get().users.find(function(u){ return u.id === id; }) || null;
  }
  function canAccess(view){
    var u = current();
    var it = MENU.find(function(m){ return m.id === view; });
    return !!(it && u && it.roles.indexOf(u.role) > -1);
  }
  function menu(){
    var u = current();
    var isTrainer = u && u.role === 'trainer';
    return MENU.filter(function(m){ return u && m.roles.indexOf(u.role) > -1; }).map(function(m){
      var clone = { id:m.id, label:m.label, icon:m.icon };
      if (isTrainer && m.trainerLabel){ clone.label = m.trainerLabel; clone.icon = m.trainerIcon; }
      return clone;
    });
  }
  function login(role, code){
    var u = Store.get().users.find(function(x){ return x.role === role && String(x.passcode) === String(code); });
    if (u){ localStorage.setItem('gymflow_session', u.id); return u; }
    return null;
  }
  function logout(){ localStorage.removeItem('gymflow_session'); }
  function trainers(){ return Store.get().users.filter(function(u){ return u.role === 'trainer'; }); }
  function roleLabel(r){ return { manager:'Manager', frontdesk:'Front Desk', trainer:'Trainer' }[r] || r; }

  return {
    MENU: MENU, current: current, canAccess: canAccess, menu: menu,
    login: login, logout: logout, trainers: trainers, roleLabel: roleLabel
  };
})();

    camera:    '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    help:      '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-.9 1-.9 1.7M12 17h.01"/>',
    store:     '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M9 21v-6h6v6"/>',
    history:   '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/>'
  };

  function icon(name, size){
    var d = ICONS[name] || ICONS.help;
    return '<svg class="ic" width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }

  /* ---------------- formatting ---------------- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function fmtDate(ms){ var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function fmtTime(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDateTime(ms){ return fmtDate(ms) + ' ' + fmtTime(ms); }
  function parseDate(str){ var p = String(str).split('-'); return new Date(+p[0], +p[1]-1, +p[2]).getTime(); }
  function todayStr(){ return fmtDate(Date.now()); }
  function money(n){ var s = Store.get().settings; return (s.currency || 'Rs') + ' ' + Math.round(n).toLocaleString('en-PK'); }
  function daysLeft(m){ return Math.ceil((m.renewal - Store.today()) / Store.DAY); }
  function avatar(name){
    var parts = String(name || '?').trim().split(/\s+/);
    var init = (parts[0] || '?')[0].toUpperCase() + (parts.length > 1 ? parts[parts.length-1][0].toUpperCase() : '');
    return '<span class="avatar">' + esc(init) + '</span>';
  }

  /* ---------------- status: badge + meter ---------------- */
  var STATUS = {
    active:   { label:'Active',        cls:'b-active' },
    expiring: { label:'Expiring soon', cls:'b-expiring' },
    overdue:  { label:'Overdue',       cls:'b-overdue' },
    inactive: { label:'Inactive',      cls:'b-inactive' }
  };
  var STATUS_COLOR = { active:'#059669', expiring:'#d97706', overdue:'#dc2626', inactive:'#94a3b8' };
  function badge(status, withDot){
    var s = STATUS[status] || STATUS.inactive;
    var dot = withDot === false ? '' : '<span class="bdot"></span>';
    return '<span class="badge ' + s.cls + '">' + dot + s.label + '</span>';
  }
  function statusColor(status){ return STATUS_COLOR[status] || STATUS_COLOR.inactive; }

  /* refined membership meter (replaces the old "plate loader") */
  function meter(m){
    var status = Store.statusOf(m);
    var dl = daysLeft(m);
    var planDays = Store.get().settings.planDays[m.plan] || 30;
    var ratio = Math.max(0, Math.min(1, dl / planDays));
    var pct = Math.round(ratio * 100);
    var color = statusColor(status);
    var label = status === 'overdue' ? 'Overdue ' + Math.abs(dl) + 'd'
              : status === 'inactive' ? 'Inactive'
              : dl + 'd left';
    return '<div class="meter">' +
      '<div class="meter-track"><div class="meter-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<span class="meter-label" style="color:' + color + '">' + label + '</span></div>';
  }

  /* ---------------- toasts ---------------- */
  function toast(msg, type, action){
    var root = document.getElementById('toast-root');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'info');
    var iconName = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'activity';
    t.innerHTML = icon(iconName, 15) + '<span class="tt">' + esc(msg) + '</span>';
    if (action && action.label){
      var a = document.createElement('button');
      a.className = 'toast-action';
      a.textContent = action.label;
      a.addEventListener('click', function(){
        try { action.fn(); } catch(e){}
        t.remove();
      });
      t.appendChild(a);
    }
    root.appendChild(t);
    var dismiss = setTimeout(function(){ close(); }, action ? 6500 : 3200);
    function close(){ t.classList.add('out'); clearTimeout(dismiss); setTimeout(function(){ t.remove(); }, 300); }
    t.addEventListener('click', function(e){
      if (e.target === t || e.target.classList.contains('tt')) close();
    });
  }

  /* ---------------- modals ---------------- */
  function modalShell(title, body, footer, opts){
    opts = opts || {};
    return '<div class="overlay"><div class="modal' + (opts.size ? ' modal-' + opts.size : '') + '">' +
      '<div class="modal-head"><h3>' + title + '</h3>' +
      '<button class="icon-btn" data-close aria-label="Close">' + icon('x', 16) + '</button></div>' +
      '<div class="modal-body">' + body + '</div>' +
      (footer ? '<div class="modal-foot">' + footer + '</div>' : '') +
      '</div></div>';
  }
  function openOverlay(html, drawerMode){
    var root = document.getElementById('modal-root');
    root.innerHTML = html;
    var overlay = root.firstElementChild;
    overlay.addEventListener('mousedown', function(e){ if (e.target === overlay) closeOverlay(); });
    var el = root.querySelector('.modal') || root.querySelector('.drawer');
    return el;
  }
  function closeOverlay(){
    var root = document.getElementById('modal-root');
    if (typeof window.UI_MODAL_CLOSE === 'function'){ try { window.UI_MODAL_CLOSE(); } catch(e){} window.UI_MODAL_CLOSE = null; }
    root.innerHTML = '';
  }
  document.addEventListener('click', function(e){
    var c = e.target.closest('[data-close]');
    if (c) closeOverlay();
  });
  function showModal(title, body, footer, opts){
    openOverlay(modalShell(title, body, footer || '', opts));
    return document.querySelector('#modal-root .modal');
  }
  function confirmAction(title, msg, onYes, yesLabel){
    var body = '<div class="confirm-body"><span class="confirm-ic">' + icon('alert', 20) + '</span><p>' + msg + '</p></div>';
    var footer = '<button class="btn btn-ghost" data-close>Cancel</button>' +
      '<button class="btn btn-danger" id="cf-yes">' + (yesLabel || 'Confirm') + '</button>';
    showModal(title, body, footer);
    document.getElementById('cf-yes').addEventListener('click', function(){
      closeOverlay();
      if (onYes) onYes();
    });
  }

  /* ---------------- drawer ---------------- */
  function drawer(title, body, footer){
    openOverlay('<div class="overlay"><div class="drawer">' +
      '<div class="drawer-head"><h3>' + title + '</h3>' +
      '<button class="icon-btn" data-close aria-label="Close">' + icon('x', 16) + '</button></div>' +
      '<div class="drawer-body">' + body + '</div>' +
      (footer ? '<div class="drawer-foot">' + footer + '</div>' : '') +
      '</div></div>');
    return document.querySelector('#modal-root .drawer');
  }
  function closeDrawer(){ closeOverlay(); }

  /* ---------------- WhatsApp ---------------- */
  function waDigits(phone){
    var d = String(phone || '').replace(/[^\d]/g, '');
    if (!d) return '';
    if (d[0] === '0') d = '92' + d.slice(1);
    if (d.length === 10) d = '92' + d;
    return d;
  }
  function waLink(phone, text){
    return 'https://wa.me/' + waDigits(phone) + '?text=' + encodeURIComponent(text);
  }
  function openWa(phone, text){
    var link = waLink(phone, text);
    window.open(link, '_blank');
    return link;
  }

  /* ---------------- QR ---------------- */
  function qrPayload(m){
    return JSON.stringify({ gym: Store.get().settings.gymName, id: m.id, name: m.name });
  }
  function qrUrl(m){
    return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(qrPayload(m));
  }

  /* ---------------- misc ---------------- */
  function download(filename, content, mime){
    var blob = new Blob([content], { type: mime || 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
  }
  function copyText(text, done){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard', 'success'); if (done) done(); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied to clipboard', 'success'); if (done) done(); }
      catch(e){ toast('Copy failed', 'error'); }
      ta.remove();
    }
  }
  function randomQuote(){
    var q = Store.get().settings.quotes || [];
    return q.length ? q[Math.floor(Math.random() * q.length)] : 'Stay strong!';
  }
  function greet(){
    var h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    return 'Good evening';
  }

  return {
    ICONS: ICONS, icon: icon,
    esc: esc, pad: pad, fmtDate: fmtDate, fmtTime: fmtTime, fmtDateTime: fmtDateTime,
    parseDate: parseDate, todayStr: todayStr, money: money, daysLeft: daysLeft, avatar: avatar,
    badge: badge, statusColor: statusColor, meter: meter,
    toast: toast, openOverlay: openOverlay, closeOverlay: closeOverlay, closeDrawer: closeDrawer,
    showModal: showModal, confirmAction: confirmAction, drawer: drawer,
    waDigits: waDigits, waLink: waLink, openWa: openWa,
    qrPayload: qrPayload, qrUrl: qrUrl, download: download,
    copyText: copyText, randomQuote: randomQuote, greet: greet
  };
})();

window.Views = window.Views || {};

function statCard(iconKey, tone, value, label, trend, view){
  var click = view ? ' data-action="go" data-view="' + view + '"' : '';
  return '<div class="stat-card"' + click + '>' +
    '<span class="stat-icon ' + tone + '">' + UI.icon(iconKey, 15) + '</span>' +
    '<div class="stat-value">' + value + '</div>' +
    '<div class="stat-label">' + label + '</div>' +
    (trend ? '<div class="stat-trend">' + trend + '</div>' : '') +
    '</div>';
}
function baseOpts(prefix, yLabel){
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color:'#98a2b3', boxWidth:10, boxHeight:10, usePointStyle:true } } },
    scales: {
      x: { ticks: { color:'#98a2b3', font:{size:11} }, grid: { color:'rgba(128,140,160,.10)' } },
      y: { beginAtZero: true, ticks: { color:'#98a2b3', font:{size:11}, callback: function(v){ return prefix ? prefix + ' ' + v : v; } }, grid: { color:'rgba(128,140,160,.10)' } }
    }
  };
}

Views.dashboard = function(){

  var exp  = members.filter(function(m){ return Store.statusOf(m) === 'expiring'; }).length;
  var ovd  = members.filter(function(m){ return Store.statusOf(m) === 'overdue'; }).length;
  var todayAtt = Store.checkinsOn(Store.today());
  var mr = Store.monthRange(Date.now());
  var rev = Store.revenueBetween(mr.start, mr.end);
  var expAmt = Store.expensesBetween(mr.start, mr.end);
  var net = rev - expAmt;
  var dueDues = Store.overdueDues();

  var upcoming = Store.renewalsUpcoming(7);
  var overdueList = members.filter(function(m){ return Store.statusOf(m) === 'overdue'; })
    .sort(function(a,b){ return a.renewal - b.renewal; });
  var feed = Store.activity().slice(0, 7);
  var lowStock = s.products.filter(function(p){ return p.stock < p.threshold; });

  var html =
  '<div class="page-head">' +
    '<div><h1>' + UI.greet() + ', ' + UI.esc(u.name.split(' ')[0]) + '</h1>' +
    '<p class="page-sub">Overview for <b>' + UI.esc(s.settings.gymName) + '</b> — ' + new Date().toLocaleDateString('en-PK', { weekday:'long', day:'numeric', month:'long' }) + '</p></div>' +
    '<div class="page-actions">' +
      '<button class="btn" data-action="go" data-view="checkin">' + UI.icon('qr', 15) + ' Check-in</button>' +
      '<button class="btn" data-action="go-add">' + UI.icon('plus', 15) + ' Add Member</button>' +
      '<button class="btn btn-primary" data-action="go" data-view="pos">' + UI.icon('cart', 15) + ' New Sale</button>' +
    '</div>' +
  '</div>' +

  '<div class="stat-grid">' +
    statCard('users', 'green', act, 'Active members', members.length + ' total', 'members') +
    statCard('clock', 'amber', exp, 'Expiring ≤ ' + s.settings.reminderDays + 'd', upcoming.length + ' renewals this week', 'members') +
    statCard('alert', 'red', ovd, 'Overdue', UI.money(dueDues) + ' outstanding', 'members') +
    statCard('qr', 'blue', todayAtt.length, 'Check-ins today', allAtt.length ? 'latest ' + UI.fmtTime(allAtt[0].ts) : '', 'checkin') +
    statCard('banknote', 'green', UI.money(rev), 'Revenue (this month)', 'incl. ' + UI.money(dueDues) + ' dues to collect', 'finance') +
    statCard('up', net >= 0 ? 'blue' : 'red', UI.money(net), 'Net (this month)', 'after ' + UI.money(expAmt) + ' expenses', 'finance') +
  '</div>' +

  '<div class="grid-2">' +
    '<div class="card"><div class="card-head"><h3>Check-ins by hour — today</h3></div>' +
      '<div class="chart-box"><canvas id="ch-hour"></canvas></div></div>' +
    '<div class="card"><div class="card-head"><h3>Monthly revenue vs expenses</h3></div>' +
      '<div class="chart-box"><canvas id="ch-month"></canvas></div></div>' +
  '</div>' +

  '<div class="grid-2">' +
    '<div class="card"><div class="card-head"><h3>Upcoming renewals</h3>' +
      '<button class="btn btn-ghost btn-sm" data-action="go" data-view="members">View all</button></div>' +
      '<div class="list">' + (upcoming.map(function(m){
        return '<div class="list-row"><div class="list-main">' + UI.avatar(m.name) +
          '<div><b>' + UI.esc(m.name) + '</b><span class="muted small">' + UI.esc(m.plan) + ' · renews ' + UI.fmtDate(m.renewal) + '</span></div></div>' +
          UI.badge(Store.statusOf(m)) +
          '<button class="btn btn-sm btn-primary" data-action="paid" data-id="' + m.id + '">Mark Paid</button></div>';
      }).join('') || '<p class="muted small">No renewals in the next ' + s.settings.reminderDays + ' days.</p>') + '</div></div>' +

    '<div class="card"><div class="card-head"><h3>Overdue dues</h3>' +
      '<span class="count-pill">' + UI.money(dueDues) + '</span></div>' +
      '<div class="list">' + (overdueList.map(function(m){
        return '<div class="list-row"><div class="list-main">' + UI.avatar(m.name) +
          '<div><b>' + UI.esc(m.name) + '</b><span class="muted small">' + UI.esc(m.plan) + ' · overdue ' + Math.abs(UI.daysLeft(m)) + 'd</span></div></div>' +
          '<button class="btn btn-sm btn-primary" data-action="paid" data-id="' + m.id + '">Mark Paid</button></div>';
      }).join('') || '<p class="muted small">Nothing overdue. Nice.</p>') + '</div></div>' +
  '</div>' +

  '<div class="grid-2">' +
    '<div class="card"><div class="card-head"><h3>Low stock alerts</h3>' +
      '<button class="btn btn-ghost btn-sm" data-action="go" data-view="pos">Store</button></div>' +
      '<div class="list">' + (lowStock.map(function(p){
        var bad = p.stock <= 0;

    if (act === 'go') App.nav(t.getAttribute('data-view'));
    else if (act === 'go-add') App.nav('members', { open:'add' });
    else if (act === 'paid'){
      var m = Store.member(t.getAttribute('data-id'));
      if (m) markPaidFlow(m);

    hourData.push(todayAtt.filter(function(a){ return new Date(a.ts).getHours() === h; }).length);
  }
  var series = [];
  var dd = new Date();
  for (var i = 5; i >= 0; i--){
    var d0 = new Date(dd.getFullYear(), dd.getMonth() - i, 1);
    var r = Store.monthRange(d0.getTime());
    series.push({ label: d0.toLocaleDateString('en', { month:'short' }),
      income: Store.revenueBetween(r.start, r.end), expense: Store.expensesBetween(r.start, r.end) });

  if (window.Chart){

          { label:'Expenses',data: series.map(function(x){ return x.expense; }), borderColor:'#dc2626', backgroundColor:'rgba(220,38,38,.08)', fill:true, tension:.35, pointRadius:3, borderWidth:2 }
        ] },
      options: baseOpts('Rs', '') });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.chart-box'), function(b){
      b.innerHTML = '<p>Charts need internet to load Chart.js.</p>';
    });
  }
};

  function logRow(a, forHistory){
    var m = Store.member(a.memberId);
    if (!m) return '';
    var t = Store.get().users.find(function(x){ return x.id === m.trainerId; });
    return '<div class="list-row"><div class="list-main">' + UI.avatar(m.name) +
      '<div><b>' + UI.esc(m.name) + '</b><span class="muted small">' +
      (forHistory ? UI.fmtDateTime(a.ts) : UI.fmtTime(a.ts)) + ' · trainer: ' + UI.esc(t ? t.name : '—') +
      '</span></div></div>' + UI.badge(Store.statusOf(m)) +
      (canRemove ? '<button class="icon-btn danger" data-action="del-att" data-id="' + a.id + '" title="Remove entry">' + UI.icon('trash', 14) + '</button>' : '') + '</div>';
  }
  function renderToday(){
    document.getElementById('ci-today').innerHTML =
      (Store.checkinsOn(Store.today()).slice().sort(function(a,b){ return b.ts - a.ts; }).map(function(a){ return logRow(a, false); }).join('') ||
      '<p class="muted small">No check-ins yet today.</p>');
  }
  renderToday();

  function renderHistory(){
    var ts = UI.parseDate(document.getElementById('ci-date').value || UI.todayStr());
    var list = s.attendance.filter(function(a){ return a.ts >= Store.startOfDay(ts) && a.ts < Store.startOfDay(ts) + Store.DAY; })
      .sort(function(a,b){ return b.ts - a.ts; }).slice(0, 60);
    document.getElementById('ci-history').innerHTML = list.map(function(a){ return logRow(a, true); }).join('') ||
      '<p class="muted small">No records for this date.</p>';
  }
  renderHistory();
  document.getElementById('ci-date').addEventListener('change', renderHistory);

  document.getElementById('btn-scan').addEventListener('click', startScanner);

  document.getElementById('view').onclick = function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var act = t.getAttribute('data-action');
    if (act === 'checkin'){ doCheckin(t.getAttribute('data-id')); }
    else if (act === 'del-att'){
      UI.confirmAction('Remove record', 'Delete this attendance entry?', function(){
        Store.deleteAttendance(t.getAttribute('data-id'));
        UI.toast('Entry removed', 'success');
        Views.checkin();
      }, 'Remove');
    }
  };
};

function doCheckin(id){
  var m = Store.member(id);
  if (!m) return;
  Store.checkIn(id);
  UI.toast('Checked in: ' + m.name, 'success');
  Views.checkin();
}

/* -------- QR camera scanner -------- */
function startScanner(){
  var modal = UI.showModal('Scan member QR pass',
    '<div id="qr-reader"></div><p class="muted small mt">Point the camera at the member’s QR pass on their phone. ' +
    'The camera needs <b>localhost</b> or <b>HTTPS</b> — allow access when prompted.</p>',
    '<button class="btn" data-close>Close</button>');
  if (!window.Html5Qrcode){
    UI.toast('Scanner library not loaded (internet needed)', 'error');
    return;
  }
  var scanner = new Html5Qrcode('qr-reader');
  var done = false;
  window.UI_MODAL_CLOSE = function(){
    if (scanner && !done){ try { scanner.stop().catch(function(){}); } catch(e){} }
  };
  function finish(m){
    if (done) return;
    done = true;
    if (scanner){ try { scanner.stop().catch(function(){}); } catch(e){} }
    UI.closeOverlay();
    Store.checkIn(m.id);
    UI.toast('Checked in: ' + m.name, 'success');
    Views.checkin();
  }
  scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:230, height:230 } },
    function(text){
      var d = null;
      try { d = JSON.parse(text); } catch(e){}
      var m = d && d.id ? Store.member(d.id) : null;
      if (m) finish(m);
      else UI.toast('QR not recognised', 'error');
    },
    function(){}
  ).catch(function(err){
    UI.toast('Camera unavailable: ' + err, 'error');
  });
}

window.Views = window.Views || {};

var MS = { q:'', status:'', plan:'', trainer:'', sel:{} };
var SPLITS = {
  'push-pull-legs': { label:'Push / Pull / Legs', days:['Push Day','Pull Day','Leg Day','Rest','Push Day','Pull Day','Leg Day'] },
  'upper-lower':    { label:'Upper / Lower',      days:['Upper Body','Lower Body','Rest','Upper Body','Lower Body','Rest','Rest'] },
  'bro':            { label:'Bro Split',          days:['Chest','Back','Shoulders','Arms','Legs','Rest','Rest'] },
  'full':           { label:'Full Body',          days:['Full Body A','Full Body B','Rest','Full Body A','Full Body B','Rest','Rest'] },
  'custom':         { label:'Custom',             days:['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7'] }
};
var MEALS = [
  { k:'breakfast', label:'Breakfast' }, { k:'lunch', label:'Lunch' },
  { k:'pre', label:'Pre-Workout' }, { k:'dinner', label:'Dinner' },
  { k:'extra', label:'Supplements & Notes' }
];

function planOptions(sel){
  return ['monthly','quarterly','annual'].map(function(p){
    return '<option value="' + p + '"' + (sel === p ? ' selected' : '') + '>' + p[0].toUpperCase() + p.slice(1) + '</option>';
  }).join('');
}
function trainerOptions(sel){
  return Auth.trainers().map(function(t){
    return '<option value="' + t.id + '"' + (sel === t.id ? ' selected' : '') + '>' + UI.esc(t.name) + '</option>';
  }).join('');
}
function splitOptions(sel){
  var out = '';
  for (var k in SPLITS) out += '<option value="' + k + '"' + (sel === k ? ' selected' : '') + '>' + SPLITS[k].label + '</option>';
  return out;
}

/* ================= MEMBERS DIRECTORY ================= */

    if (MS.plan && m.plan !== MS.plan) return false;

      '<button class="btn" data-action="wa-batch" data-kind="reminder">' + UI.icon('message', 15) + ' Reminders</button>' +
      '<button class="btn" data-action="wa-batch" data-kind="quote">' + UI.icon('zap', 15) + ' Quotes</button>' +

    '<div class="toolbar">' +
      '<input id="m-search" class="search-input" placeholder="Search name or phone…" value="' + UI.esc(MS.q) + '" />' +
      '<select id="f-status" class="select"><option value="">All statuses</option>' +
        '<option value="active"'   + (MS.status==='active'   ? ' selected':'') + '>Active</option>' +
        '<option value="expiring"' + (MS.status==='expiring' ? ' selected':'') + '>Expiring soon</option>' +
        '<option value="overdue"'  + (MS.status==='overdue'  ? ' selected':'') + '>Overdue</option>' +
        '<option value="inactive"' + (MS.status==='inactive' ? ' selected':'') + '>Inactive</option></select>' +
      '<select id="f-plan" class="select"><option value="">All plans</option>' + planOptions(MS.plan || '') + '</select>' +

      '<th>Member</th><th>Plan</th><th>Trainer</th><th class="th-numeric">Renewal</th><th>Status</th><th style="width:150px"></th>' +
    '</tr></thead><tbody>' +
    (list.map(function(m){
      var t = s.users.find(function(x){ return x.id === m.trainerId; });
      var dl = UI.daysLeft(m);
      return '<tr class="clickable-row" data-open="' + m.id + '">' +
        '<td><input type="checkbox" class="row-sel" data-id="' + m.id + '"' + (MS.sel[m.id] ? ' checked' : '') + ' /></td>' +
        '<td><div class="cell-user">' + UI.avatar(m.name) + '<div><b>' + UI.esc(m.name) + '</b>' +
          '<span class="muted small">' + UI.esc(m.phone || '') + (m.active === false ? ' · archived' : '') + '</span></div></div></td>' +
        '<td><span class="plan-chip">' + m.plan[0].toUpperCase() + m.plan.slice(1) + '</span></td>' +

        '<td class="td-status">' + UI.badge(Store.statusOf(m)) + UI.meter(m) + '</td>' +
        '<td><div class="row-actions">' +
          (isManager ? '<button class="icon-btn" data-action="paid" data-id="' + m.id + '" title="Mark paid">' + UI.icon('card', 14) + '</button>' : '') +
          '<button class="icon-btn" data-action="wa" data-id="' + m.id + '" title="WhatsApp">' + UI.icon('message', 14) + '</button>' +
          '<button class="icon-btn" data-action="qr" data-id="' + m.id + '" title="QR pass">' + UI.icon('qr', 14) + '</button>' +
          '<button class="icon-btn" data-action="plan" data-id="' + m.id + '" title="Plans">' + UI.icon('clipboard', 14) + '</button>' +
          (!isTrainer ? '<button class="icon-btn" data-action="edit" data-id="' + m.id + '" title="Edit">' + UI.icon('pencil', 14) + '</button>' : '') +
          (isManager ? '<button class="icon-btn danger" data-action="del" data-id="' + m.id + '" title="Delete">' + UI.icon('trash', 14) + '</button>' : '') +

    }).join('') || '<tr><td colspan="7" class="empty-td">No members match your filters.</td></tr>') +
    '</tbody></table></div></div>';

  document.getElementById('view').innerHTML = html;

  if (ctx && ctx.open === 'add') memberForm(null);

  /* ---- filtering ---- */

  var inSearch = document.getElementById('m-search');
  inSearch.addEventListener('input', function(){ MS.q = inSearch.value; refresh({ q: inSearch.value }); });
  document.getElementById('f-status').addEventListener('change', function(){ MS.status = this.value; refresh(); });
  document.getElementById('f-plan').addEventListener('change', function(){ MS.plan = this.value; refresh(); });
  var ft = document.getElementById('f-trainer');
  if (ft) ft.addEventListener('change', function(){ MS.trainer = this.value; refresh(); });

  /* ---- selection ---- */
  document.getElementById('sel-all').addEventListener('change', function(){
    var c = this.checked;
    Array.prototype.forEach.call(document.querySelectorAll('.row-sel'), function(b){ b.checked = c; });
    MS.sel = {};
    if (c) Array.prototype.forEach.call(document.querySelectorAll('.row-sel'), function(b){ MS.sel[b.getAttribute('data-id')] = true; });
  });
  document.getElementById('view').onchange = function(e){
    if (e.target.classList.contains('row-sel')){
      if (e.target.checked) MS.sel[e.target.getAttribute('data-id')] = true;
      else delete MS.sel[e.target.getAttribute('data-id')];
    }
  };

  /* ---- actions ---- */
  function selectedIds(){
    var ids = [];
    for (var k in MS.sel) if (MS.sel[k]) ids.push(k);
    return ids;
  }
  function currentList(){ return list; }

  document.getElementById('view').onclick = function(e){
    if (e.target.closest('input')) return; // don't open drawer for checkbox clicks
    var t = e.target.closest('[data-action]');
    if (t){
      var act = t.getAttribute('data-action'), id = t.getAttribute('data-id');
      var mm = id ? Store.member(id) : null;
      if (act === 'add') memberForm(null);
      else if (act === 'edit' && mm) memberForm(mm);
      else if (act === 'wa' && mm) waModal(mm);
      else if (act === 'qr' && mm) qrModal(mm);
      else if (act === 'paid' && mm) markPaidFlow(mm);
      else if (act === 'del' && mm){

            UI.toast('Member deleted', 'success', {
              label:'Undo',
              fn:function(){
                Store.addMember(gone, { keepId:true });
                UI.toast('Member restored', 'success');
                refresh();
              }
            });
          }
          refresh();
        }, 'Delete');
      }
      else if (act === 'plan' && mm) App.nav('plans', { member: mm.id });
      else if (act === 'wa-batch') batchWa(t.getAttribute('data-kind'));
      else if (act === 'go') App.nav(t.getAttribute('data-view'));
      return;
    }
    var row = e.target.closest('[data-open]');
    if (row){
      var m = Store.member(row.getAttribute('data-open'));
      if (m) Views.openMember(m);
    }
  };

  function batchWa(kind){
    var ids = selectedIds();
    var ms = ids.length ? currentList().filter(function(m){ return ids.indexOf(m.id) > -1; }) : currentList();
    if (!ms.length){ UI.toast('No members selected/found', 'error'); return; }
    ms.forEach(function(m, i){
      setTimeout(function(){
        var text = kind === 'reminder' ? reminderText(m) : quoteText(m);
        UI.openWa(m.phone, text);
      }, i * 450);
    });
    UI.toast('Opening WhatsApp for ' + ms.length + ' member' + (ms.length > 1 ? 's' : '') + ' — allow pop-ups if blocked', 'info');
  }
};

/* ---------------- plan builder ---------------- */
var PB_VALS = [];
function planBuilder(m, kind){
  var u = Auth.current();
  var isWorkout = kind === 'workout';
  var title = (isWorkout ? 'Workout plan' : 'Diet plan') + ' — ' + m.name;

  var body =
    '<div class="field"><label>Plan title</label><input id="pb-title" class="input" value="' + UI.esc(m.name) + (isWorkout ? ' — Workout' : ' — Diet') + '" /></div>' +
    (isWorkout
      ? '<div class="field"><label>Workout split</label><select id="pb-split" class="input">' + splitOptions('push-pull-legs') + '</select></div><div id="pb-days"></div>'
      : '<div id="pb-meals"></div>') +
    '<p class="muted small mt">Daily routine text is included in the WhatsApp message exactly as written.</p>';

  var footer = '<button class="btn" data-close>Cancel</button>' +
    '<button class="btn" id="pb-save">' + UI.icon('database', 14) + ' Save locally</button>' +
    '<button class="btn btn-primary" id="pb-send">' + UI.icon('send', 14) + ' Save & Send</button>';

  UI.showModal(title, body, footer, { size:'lg' });

  if (isWorkout){
    PB_VALS = [];
    renderDays('push-pull-legs');
    document.getElementById('pb-split').addEventListener('change', function(){ renderDays(this.value); });
  } else {
    document.getElementById('pb-meals').innerHTML =
      MEALS.map(function(mk){
        return '<div class="field"><label>' + mk.label + '</label><textarea class="input plan-textarea" data-meal="' + mk.k + '" placeholder="Food, portions & timing…"></textarea></div>';
      }).join('');
  }

  function renderDays(key){
    var sp = SPLITS[key];
    document.getElementById('pb-days').innerHTML = sp.days.map(function(label, i){
      return '<div class="plan-day"><div class="plan-day-label">' + label + '</div>' +
        '<textarea class="input plan-textarea" data-d="' + i + '" placeholder="Exercises, sets & reps…">' + UI.esc(PB_VALS[i] || '') + '</textarea></div>';
    }).join('');
  }

  function collect(){
    var plan = {
      memberId: m.id, trainerId: u.id, kind: kind,
      title: document.getElementById('pb-title').value.trim() || (isWorkout ? 'Workout' : 'Diet'),
      split: null, days: [], meals: {}
    };
    if (isWorkout){
      var key = document.getElementById('pb-split').value;
      plan.split = SPLITS[key].label;
      plan.days = SPLITS[key].days.map(function(label, i){
        return { label: label, text: (document.querySelector('[data-d="' + i + '"]') || {}).value || '' };
      });
      plan.meals = null;
    } else {
      plan.split = 'Diet';
      plan.days = [];
      plan.meals = {};
      MEALS.forEach(function(mk){
        var el = document.querySelector('[data-meal="' + mk.k + '"]');
        plan.meals[mk.k] = el ? el.value : '';
      });
    }
    return plan;
  }

  document.getElementById('pb-save').addEventListener('click', function(){
    var p = Store.addPlan(collect());
    UI.toast('Plan saved locally', 'success');
    UI.closeOverlay();
    Views.plans({ member: m.id });
  });
  document.getElementById('pb-send').addEventListener('click', function(){
    var p = Store.addPlan(collect());
    UI.toast('Plan saved & WhatsApp opening…', 'success');
    UI.closeOverlay();
    UI.openWa(m.phone, planText(p, m));
    Views.plans({ member: m.id });
  });
}

function planText(p, m){
  var s = Store.get();
  var trainer = Store.user(p.trainerId);
  var L = [];
  L.push('💪 ' + p.title.toUpperCase());
  L.push('📍 ' + s.settings.gymName + (trainer ? ' · Trainer: ' + trainer.name : ''));
  if (p.split) L.push('🗂️ Split: ' + p.split);
  L.push('──────────────────');
  L.push('');
  (p.days || []).forEach(function(d){
    if (d && d.text && d.text.trim()){
      L.push('🏋️ ' + d.label);
      L.push(d.text.trim());
      L.push('');
    }
  });
  if (p.meals){
    var any = MEALS.some(function(mk){ return (p.meals[mk.k] || '').trim(); });
    if (any){
      L.push('🥗 DIET PLAN');
      MEALS.forEach(function(mk){
        var v = (p.meals[mk.k] || '').trim();
        if (v){ L.push(mk.label); L.push(v); L.push(''); }
      });
    }
  }
  L.push('Stay consistent — see you at the gym! 💪');
  return L.join('\n');
}

function planView(p, m){
  var body = '<pre class="plan-text">' + UI.esc(planText(p, m)) + '</pre>';
  var footer = '<button class="btn" data-close>Close</button>' +
    '<button class="btn" id="pv-copy">' + UI.icon('copy', 14) + ' Copy</button>' +
    '<button class="btn btn-primary" id="pv-send">' + UI.icon('send', 14) + ' Send WhatsApp</button>';
  UI.showModal(UI.esc(p.title), body, footer, { size:'lg' });
  document.getElementById('pv-copy').addEventListener('click', function(){ UI.copyText(planText(p, m)); });
  document.getElementById('pv-send').addEventListener('click', function(){
    UI.openWa(m.phone, planText(p, m));
    UI.toast('Opening WhatsApp…', 'success');
  });
}
